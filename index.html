<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart EduTrack - ระบบเช็คชื่ออัจฉริยะ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Fonts: Prompt & Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js สำหรับ Data Visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --primary: #0f172a; 
      --accent: #3b82f6; 
      --surface: #ffffff;
      --background: #f1f5f9; 
    }

    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: var(--background);
      color: #334155;
      overflow: hidden;
    }

    h1, h2, h3, h4, h5, h6, .font-prompt, .nav-item { 
      font-family: 'Prompt', sans-serif; 
    }

    /* Glassmorphism & Modern Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 40px -10px rgba(15, 23, 42, 0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glass-card:hover {
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
      transform: translateY(-2px);
    }

    /* Gamification Animations */
    @keyframes fire-pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.5)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.8)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.5)); }
    }
    .streak-fire { animation: fire-pulse 2s infinite; display: inline-block; }

    @keyframes hologram-sweep {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .hologram-text {
      background: linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: hologram-sweep 3s linear infinite;
    }

    /* Scanner Ring Effect */
    .scanner-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 2px solid transparent;
      pointer-events: none;
    }
    @keyframes scan-active {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      70% { box-shadow: 0 0 0 30px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .is-scanning .scanner-ring { animation: scan-active 2s infinite; border-color: rgba(59, 130, 246, 0.5); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Animations */
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ระบบเสียงล้ำสมัย (Sci-Fi Audio Feedback)
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1600, ctx.currentTime + 0.1);
          gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start(); osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'streak') {
          // เสียงปลดล็อกรางวัล
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(1600, ctx.currentTime + 0.2);
          gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start(); osc.stop(ctx.currentTime + 0.4);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, ctx.currentTime);
          gainNode.gain.setValueAtTime(0.2, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start(); osc.stop(ctx.currentTime + 0.4);
        }
      } catch (err) { console.error("Audio API error"); }
    };

    // ฐานข้อมูลนักเรียน (เพิ่มระบบ Streak และ Badges)
    const initialStudents = {
      "1001": { id: "1001", name: "เด็กชายสมชาย มุ่งมั่น", class: "ม.1/1", number: 1, attendanceRate: 98, streak: 14, badges: ['Early Bird', 'Perfect Week'], photo: null },
      "1002": { id: "1002", name: "เด็กหญิงสมหญิง รักเรียน", class: "ม.1/1", number: 2, attendanceRate: 88, streak: 3, badges: [], photo: null },
      "1003": { id: "1003", name: "เด็กชายปิติ ใฝ่รู้", class: "ม.1/2", number: 1, attendanceRate: 75, streak: 0, badges: [], photo: null },
      "1004": { id: "1004", name: "เด็กหญิงมานี ใจดี", class: "ม.1/2", number: 2, attendanceRate: 100, streak: 45, badges: ['Legendary', 'Unstoppable'], photo: null },
      "1005": { id: "1005", name: "เด็กชายวีระ กล้าหาญ", class: "ม.2/1", number: 1, attendanceRate: 82, streak: 5, badges: ['Consistent'], photo: null },
    };

    // จำลองประวัติรายเดือนสำหรับหน้า Spreadsheet
    const generateInitialAttendance = () => {
      const data = {};
      const today = new Date();
      Object.keys(initialStudents).forEach(id => {
        data[id] = {};
        for(let i=1; i<=10; i++) { // สุ่มย้อนหลัง 10 วัน
          const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
          data[id][dateStr] = Math.random() > 0.2 ? 'success' : (Math.random() > 0.5 ? 'leave' : 'error');
        }
      });
      return data;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('scan'); 
      const [studentsDB, setStudentsDB] = useState(initialStudents);
      const [logs, setLogs] = useState([]);
      const [lastScan, setLastScan] = useState(null);
      const [isFocused, setIsFocused] = useState(true);
      const [barcode, setBarcode] = useState('');
      const [toast, setToast] = useState(null);
      
      const inputRef = useRef(null);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // สำหรับหน้า Spreadsheet
      const today = new Date();
      const [selectedMonth, setSelectedMonth] = useState(today.getMonth());
      const [selectedYear, setSelectedYear] = useState(today.getFullYear());
      const [attendanceData, setAttendanceData] = useState(generateInitialAttendance());
      const [filterClass, setFilterClass] = useState('all');

      // AI Insights State
      const [aiAlerts, setAiAlerts] = useState([]);

      // Toast System
      const showToast = (message, type = 'success', icon = 'fa-check-circle') => {
        setToast({ message, type, icon });
        setTimeout(() => setToast(null), 4000);
      };

      // บังคับโฟกัสสำหรับ Scanner
      useEffect(() => {
        let focusInterval;
        if (activeTab === 'scan') {
          focusInterval = setInterval(() => {
            if (document.activeElement !== inputRef.current && inputRef.current) {
              inputRef.current.focus();
            }
          }, 300); 
        }
        return () => clearInterval(focusInterval);
      }, [activeTab]);

      // AI Predictive Analysis Logic
      useEffect(() => {
        const alerts = [];
        let lowAttendanceCount = 0;
        
        Object.values(studentsDB).forEach(s => {
          if (s.attendanceRate < 80) lowAttendanceCount++;
          if (s.streak === 0 && s.attendanceRate < 85) {
            alerts.push({ type: 'warning', msg: `เฝ้าระวัง: ${s.name} มีแนวโน้มขาดเรียนบ่อย` });
          }
        });

        if (lowAttendanceCount > 0) {
          alerts.push({ type: 'danger', msg: `พบนักเรียน ${lowAttendanceCount} คน มีอัตราการเข้าเรียนวิกฤต (<80%)` });
        }
        
        const presentCount = logs.filter(l => l.status === 'success').length;
        if (presentCount > Object.keys(studentsDB).length * 0.9) {
          alerts.push({ type: 'success', msg: `ยอดเยี่ยม! วันนี้อัตราการเข้าเรียนสูงกว่า 90%` });
        }

        setAiAlerts(alerts);
      }, [studentsDB, logs]);

      // Chart.js Rendering Logic
      useEffect(() => {
        if (activeTab === 'dashboard' && chartRef.current) {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }

          const ctx = chartRef.current.getContext('2d');
          
          // ข้อมูลจำลองสำหรับกราฟ
          const classes = [...new Set(Object.values(studentsDB).map(s => s.class))].sort();
          const presentData = classes.map(c => Object.values(studentsDB).filter(s => s.class === c && logs.some(l => l.student.id === s.id && l.status === 'success')).length);
          const absentData = classes.map(c => Object.values(studentsDB).filter(s => s.class === c && !logs.some(l => l.student.id === s.id && l.status === 'success')).length);

          chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: classes,
              datasets: [
                {
                  label: 'มาเรียน',
                  data: presentData.length > 0 ? presentData : [10, 15, 8], // mock fallback
                  backgroundColor: 'rgba(34, 197, 94, 0.8)',
                  borderRadius: 6,
                },
                {
                  label: 'ขาดเรียน',
                  data: absentData.length > 0 ? absentData : [2, 1, 3], // mock fallback
                  backgroundColor: 'rgba(239, 68, 68, 0.8)',
                  borderRadius: 6,
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { font: { family: 'Prompt' } } },
                title: { display: false }
              },
              scales: {
                y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                x: { grid: { display: false } }
              },
              animation: {
                duration: 2000,
                easing: 'easeOutQuart'
              }
            }
          });
        }
      }, [activeTab, logs, studentsDB]);

      const handleProcessBarcode = (code) => {
        const cleanCode = code.trim();
        if (!cleanCode) return;

        const student = studentsDB[cleanCode];
        const timestamp = new Date();
        const timeString = timestamp.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        // ป้องกันสแกนซ้ำภายใน 1 นาที
        const recentScan = logs.find(log => log.student?.id === cleanCode && (timestamp - log.rawTime) < 60000 && log.status === 'success');

        if (recentScan) {
          playSound('error');
          showToast(`ทำรายการซ้ำ: ${student.name}`, 'warning', 'fa-triangle-exclamation');
          return;
        }

        if (student) {
          // Gamification: เพิ่ม Streak
          const newStreak = student.streak + 1;
          const isMilestone = newStreak % 5 === 0; // ทุกๆ 5 วันติดจะได้รางวัล
          
          if (isMilestone) playSound('streak');
          else playSound('success');

          // อัปเดต DB
          const updatedStudent = { ...student, streak: newStreak };
          setStudentsDB(prev => ({ ...prev, [cleanCode]: updatedStudent }));

          const newLog = { id: Math.random().toString(36).substr(2, 9), rawTime: timestamp, time: timeString, student: updatedStudent, status: 'success' };
          
          setLogs([newLog, ...logs]);
          setLastScan({ id: Math.random(), status: 'success', student: updatedStudent, time: timeString, milestone: isMilestone });
          
          // บันทึกลงตารางรายเดือน
          const dateKey = `${timestamp.getFullYear()}-${String(timestamp.getMonth() + 1).padStart(2, '0')}-${String(timestamp.getDate()).padStart(2, '0')}`;
          setAttendanceData(prev => ({
            ...prev,
            [student.id]: { ...(prev[student.id] || {}), [dateKey]: 'success' }
          }));

          if(isMilestone) showToast(`🎉 ปลดล็อกความสำเร็จ! ${student.name} มาเรียน ${newStreak} วันติด!`, 'success', 'fa-fire');
        } else {
          playSound('error');
          setLogs(prev => [{ id: Math.random().toString(36).substr(2, 9), rawTime: timestamp, time: timeString, codeScanned: cleanCode, status: 'error' }, ...prev]);
          setLastScan({ id: Math.random(), status: 'error', message: 'ไม่พบฐานข้อมูล', codeScanned: cleanCode, time: timeString });
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleProcessBarcode(barcode);
          setBarcode('');
        }
      };

      // ฟังก์ชันจัดการตาราง Spreadsheet
      const handleCellEdit = (id, field, value) => {
        setStudentsDB(prev => ({
          ...prev,
          [id]: { ...prev[id], [field]: field === 'number' || field === 'attendanceRate' ? (parseInt(value) || 0) : value }
        }));
      };

      const handleAttendanceCellToggle = (studentId, dateKey) => {
        setAttendanceData(prev => {
          const currentStatus = prev[studentId]?.[dateKey];
          let nextStatus = '';
          if (!currentStatus) nextStatus = 'success';
          else if (currentStatus === 'success') nextStatus = 'leave';
          else if (currentStatus === 'leave') nextStatus = 'error'; 
          else nextStatus = ''; 

          return { ...prev, [studentId]: { ...(prev[studentId] || {}), [dateKey]: nextStatus } };
        });
      };

      const renderScanner = () => (
        <div className="flex flex-col lg:flex-row gap-8 h-full animate-fade-in" onClick={() => {if(inputRef.current) inputRef.current.focus()}}>
          
          {/* ซ้าย: เครื่องสแกนแบบ Hologram UI */}
          <div className="w-full lg:w-5/12 flex flex-col gap-6">
            <div className={`glass-card overflow-hidden relative transition-all duration-500 ${isFocused ? 'is-scanning ring-2 ring-blue-500 ring-offset-4 ring-offset-slate-50' : 'opacity-80 scale-[0.98]'}`}>
              <div className="scanner-ring"></div>
              
              <div className="px-6 py-5 border-b border-slate-100/20 bg-gradient-to-r from-slate-900 to-blue-900 text-white flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="relative flex h-3 w-3">
                    {isFocused && <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>}
                    <span className={`relative inline-flex rounded-full h-3 w-3 ${isFocused ? 'bg-blue-500' : 'bg-red-500'}`}></span>
                  </div>
                  <h3 className="font-prompt font-semibold tracking-wider text-sm uppercase">
                    {isFocused ? 'AI Recognition Active' : 'System Paused'}
                  </h3>
                </div>
                <i className="fa-solid fa-radar text-blue-400"></i>
              </div>

              <div className="p-10 flex flex-col items-center bg-white/50 relative z-10">
                <input
                  ref={inputRef}
                  type="text"
                  value={barcode}
                  onChange={(e) => setBarcode(e.target.value)}
                  onKeyDown={handleKeyDown}
                  onFocus={() => setIsFocused(true)}
                  onBlur={() => { setIsFocused(false); setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 100); }}
                  placeholder="สแกนบัตรรหัสนักเรียน..."
                  className="w-full text-center text-4xl font-bold tracking-[0.2em] text-slate-800 placeholder-slate-300 border-none outline-none bg-transparent"
                  autoComplete="off"
                  autoFocus
                />
                <div className="h-1.5 w-32 bg-slate-200 mt-8 rounded-full overflow-hidden">
                   <div className={`h-full bg-gradient-to-r from-blue-400 to-indigo-500 w-full ${isFocused ? 'animate-[hologram-sweep_1.5s_ease-in-out_infinite]' : 'opacity-0'}`}></div>
                </div>
              </div>
            </div>

            {/* Gamified Result Card */}
            <div className="glass-card flex-1 flex flex-col min-h-[350px] relative overflow-hidden">
              {lastScan?.milestone && (
                <div className="absolute inset-0 bg-gradient-to-br from-yellow-400/20 to-orange-500/20 z-0 animate-pulse"></div>
              )}
              <div className="p-6 flex-1 flex flex-col items-center justify-center relative z-10">
                {!lastScan ? (
                  <div className="text-center text-slate-300">
                    <i className="fa-solid fa-expand text-6xl mb-4 animate-bounce"></i>
                    <p className="font-prompt font-medium">Waiting for input...</p>
                  </div>
                ) : (
                  <div key={lastScan.id} className="w-full animate-pop flex flex-col items-center text-center">
                    {lastScan.status === 'success' && (
                      <>
                        <div className="relative mb-6">
                          <div className="absolute -inset-4 bg-blue-100 rounded-full animate-ping opacity-50"></div>
                          {lastScan.student.photo ? (
                            <img src={lastScan.student.photo} className="w-36 h-36 rounded-full object-cover border-4 border-white shadow-xl relative z-10" alt="profile"/>
                          ) : (
                            <div className="w-32 h-32 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-xl relative z-10 text-white">
                               <i className="fa-solid fa-user-astronaut text-5xl"></i>
                            </div>
                          )}
                          
                          {/* Gamification Badge */}
                          <div className="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-white px-4 py-1.5 rounded-full shadow-lg border border-slate-100 flex items-center gap-2 whitespace-nowrap z-20">
                            <i className="fa-solid fa-fire text-orange-500 streak-fire text-lg"></i>
                            <span className="font-prompt font-bold text-slate-800">{lastScan.student.streak} วันติด!</span>
                          </div>
                        </div>
                        
                        <h2 className="text-3xl font-prompt font-bold text-slate-800 mb-1 hologram-text">{lastScan.student.name}</h2>
                        <p className="text-slate-500 font-medium mb-4 flex items-center gap-2 justify-center">
                          <span className="bg-slate-100 px-3 py-1 rounded-md text-sm">{lastScan.student.class}</span>
                          <span className="bg-slate-100 px-3 py-1 rounded-md text-sm">เลขที่ {lastScan.student.number}</span>
                        </p>
                        
                        {lastScan.milestone && (
                          <div className="bg-gradient-to-r from-orange-400 to-yellow-500 text-white px-6 py-2 rounded-xl font-prompt font-bold shadow-lg animate-bounce mt-2">
                            🎉 ปลดล็อกความสำเร็จใหม่!
                          </div>
                        )}
                      </>
                    )}
                    {lastScan.status === 'error' && (
                      <div className="text-rose-500">
                         <i className="fa-solid fa-circle-exclamation text-7xl mb-4"></i>
                        <h2 className="text-2xl font-prompt font-bold mb-2">Access Denied</h2>
                        <p className="bg-rose-50 text-rose-700 px-4 py-2 rounded-lg font-mono">CODE: {lastScan.codeScanned}</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* ขวา: Live Activity Feed */}
          <div className="w-full lg:w-7/12 glass-card flex flex-col h-full">
            <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center">
              <div>
                <h2 className="font-prompt font-bold text-lg text-slate-800"><i className="fa-solid fa-bolt text-blue-500 mr-2"></i> Live Activity Feed</h2>
              </div>
              <div className="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-bold font-prompt">
                {logs.length} สแกนวันนี้
              </div>
            </div>
            
            <div className="flex-1 overflow-auto p-4">
              <div className="space-y-3">
                {logs.length === 0 ? (
                  <div className="text-center py-20 text-slate-400 font-prompt">-- No activity yet --</div>
                ) : (
                  logs.map((log) => (
                    <div key={log.id} className="animate-slide-up bg-white border border-slate-100 p-4 rounded-xl flex items-center justify-between hover:shadow-md transition-shadow group">
                      <div className="flex items-center gap-4">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white shadow-sm ${log.status === 'success' ? 'bg-gradient-to-br from-emerald-400 to-green-500' : 'bg-rose-500'}`}>
                          <i className={`fa-solid ${log.status === 'success' ? 'fa-check' : 'fa-xmark'}`}></i>
                        </div>
                        <div>
                          <h4 className="font-prompt font-semibold text-slate-800">
                            {log.status === 'success' ? log.student.name : 'Unknown ID'}
                          </h4>
                          <p className="text-xs text-slate-500 font-mono">
                            {log.status === 'success' ? `${log.student.id} • ${log.student.class}` : log.codeScanned}
                          </p>
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="text-sm font-bold text-slate-700">{log.time}</div>
                        {log.status === 'success' && log.student.streak > 0 && (

                   <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" className="w-10 h-10 rounded-full border-2 border-slate-700" alt="Admin"/>
                   <div className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></div>
                </div>
                <div>
                  <div className="text-sm font-prompt font-bold text-white">System Admin</div>
                  <div className="text-xs text-slate-400">Ready to secure</div>
                </div>
              </div>
            </div>
          </aside>
          
          {/* Main App Area */}
          <main className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden relative">
            {/* Top Header */}
            <header className="h-24 bg-white/80 backdrop-blur-xl border-b border-slate-200/50 px-10 flex justify-between items-center z-10 sticky top-0 shadow-sm">
              <div>
                <h2 className="text-3xl font-prompt font-bold text-slate-800 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-500">
                  {activeTab === 'scan' && 'Kiosk Scanning Station'}
                  {activeTab === 'dashboard' && 'Executive Analytics'}
                  {activeTab === 'yearly' && 'Interactive Spreadsheet'}
                  {activeTab === 'import' && 'Database Synchronization'}
                </h2>
                <p className="text-sm font-medium text-slate-500 mt-1">Smart EduTrack V.3.0 Enterprise</p>
              </div>
              <div className="flex items-center gap-4">
                <div className="hidden md:flex bg-slate-100/80 border border-slate-200/50 px-5 py-2.5 rounded-xl text-sm font-prompt font-bold text-slate-600 items-center gap-3 shadow-inner">
                  <i className="fa-regular fa-clock text-blue-500 text-lg"></i>
                  {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' })}
                </div>
              </div>
            </header>
            
            {/* Scrollable Content */}
            <div className="flex-1 overflow-auto p-6 lg:p-10 relative z-0">
              {activeTab === 'scan' && renderScanner()}
              {activeTab === 'dashboard' && renderDashboard()}
              {activeTab === 'yearly' && renderSpreadsheet()}
              {activeTab === 'import' && renderImport()}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
