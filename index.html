<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเช็คชื่อนักเรียนระดับองค์กร (Enterprise)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary: #1e3a8a; /* Deep Blue */
      --secondary: #3b82f6; /* Blue */
      --surface: #ffffff;
      --background: #f8fafc; /* Slate 50 */
    }

    body { 
      font-family: 'Sarabun', sans-serif; 
      background-color: var(--background);
      color: #334155;
    }

    /* ใช้ Prompt สำหรับหัวข้อเพื่อความทันสมัยแต่น่าเชื่อถือ */
    h1, h2, h3, h4, h5, h6, .font-prompt, .nav-item { 
      font-family: 'Prompt', sans-serif; 
    }

    /* Premium UI Effects */
    .premium-card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 4px 24px -8px rgba(15, 23, 42, 0.08);
      transition: all 0.3s ease;
    }
    
    .premium-card:hover {
      box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.12);
    }

    .focus-ring-glow {
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    /* Custom Scrollbar for professional look */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Animations */
    @keyframes slideUpFade { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .animate-slide-up { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

    /* Formal Table Styling */
    .formal-table th { background-color: #f1f5f9; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; color: #64748b; font-family: 'Prompt', sans-serif; }
    .formal-table tr { transition: background-color 0.2s; border-bottom: 1px solid #e2e8f0; }
    .formal-table tr:hover { background-color: #f8fafc; }
    .formal-table td { padding: 1rem; vertical-align: middle; }

    /* Badges */
    .badge { padding: 0.25rem 0.75rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; font-family: 'Prompt', sans-serif; display: inline-flex; items-center; gap: 0.25rem; }
    .badge-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .badge-warning { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
    .badge-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .badge-info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }

    /* Status Pulse */
    .status-pulse { position: relative; display: flex; align-items: center; justify-content: center; width: 12px; height: 12px; }
    .status-pulse::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; opacity: 0.5; animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .status-pulse.active::before { background-color: #22c55e; }
    .status-pulse.inactive::before { background-color: #ef4444; }
    .status-pulse .dot { width: 8px; height: 8px; border-radius: 50%; z-index: 1; }
    .status-pulse.active .dot { background-color: #16a34a; }
    .status-pulse.inactive .dot { background-color: #dc2626; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ระบบเสียง (นุ่มนวล เป็นทางการมากขึ้น)
    const playBeep = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, ctx.currentTime);
          gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } else {
          osc.type = 'square';
          osc.frequency.setValueAtTime(250, ctx.currentTime);
          gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        }
      } catch (err) {
        console.error("Audio API not supported");
      }
    };

    const initialStudents = {
      "1001": { id: "1001", name: "เด็กชายสมชาย มุ่งมั่น", class: "ม.1/1", number: 1, attendanceRate: 95, photo: null },
      "1002": { id: "1002", name: "เด็กหญิงสมหญิง รักเรียน", class: "ม.1/1", number: 2, attendanceRate: 88, photo: null },
      "1003": { id: "1003", name: "เด็กชายปิติ ใฝ่รู้", class: "ม.1/2", number: 1, attendanceRate: 75, photo: null },
      "1004": { id: "1004", name: "เด็กหญิงมานี ใจดี", class: "ม.1/2", number: 2, attendanceRate: 100, photo: null },
      "1005": { id: "1005", name: "เด็กชายวีระ กล้าหาญ", class: "ม.2/1", number: 1, attendanceRate: 82, photo: null },
      "1006": { id: "1006", name: "เด็กหญิงชูใจ สดใส", class: "ม.2/1", number: 2, attendanceRate: 90, photo: null },
      "1007": { id: "1007", name: "เด็กชายเพชร แข็งแกร่ง", class: "ม.3/1", number: 1, attendanceRate: 98, photo: null },
    };

    function App() {
      const [activeTab, setActiveTab] = useState('scan'); 
      const [studentsDB, setStudentsDB] = useState(initialStudents);
      const [logs, setLogs] = useState([]);
      const [lastScan, setLastScan] = useState(null);
      const [isFocused, setIsFocused] = useState(true);
      const [barcode, setBarcode] = useState('');
      const [importText, setImportText] = useState('');
      const [filterClass, setFilterClass] = useState('all');
      const [toast, setToast] = useState(null);
      const [isAutoScanning, setIsAutoScanning] = useState(false); 
      const [addForm, setAddForm] = useState({ id: '', name: '', class: '', number: '', photo: null });

      const today = new Date();
      const [selectedMonth, setSelectedMonth] = useState(today.getMonth());
      const [selectedYear, setSelectedYear] = useState(today.getFullYear());
      const [attendanceData, setAttendanceData] = useState({});

      const inputRef = useRef(null);

      // ฟังก์ชัน Toast ที่ดูทันสมัย
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // บังคับโฟกัสสำหรับ Scanner
      useEffect(() => {
        let focusInterval;
        if (activeTab === 'scan') {
          focusInterval = setInterval(() => {
            if (document.activeElement !== inputRef.current && inputRef.current) {
              inputRef.current.focus();
            }
          }, 300); 
        }
        return () => clearInterval(focusInterval);
      }, [activeTab]);

      const totalStudents = Object.keys(studentsDB).length;
      const presentLogs = logs.filter(l => l.status === 'success' || l.status === 'leave');
      const uniquePresentIds = new Set(presentLogs.map(l => l.student?.id));
      const presentCount = uniquePresentIds.size;
      const leaveCount = new Set(logs.filter(l => l.status === 'leave').map(l => l.student?.id)).size;
      const absentCount = totalStudents - presentCount;
      const allClasses = [...new Set(Object.values(studentsDB).map(s => s.class))].sort();

      const handleProcessBarcode = (code, manualStatus = null) => {
        const cleanCode = code.trim();
        if (!cleanCode) return;

        const student = studentsDB[cleanCode];
        const timestamp = new Date();
        const timeString = timestamp.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        if (!manualStatus) {
          const recentScan = logs.find(
            log => log.student?.id === cleanCode && 
            (timestamp - log.rawTime) < 60000 && 
            (log.status === 'success')
          );

          if (recentScan) {
            playBeep('error');
            setLastScan({ id: Math.random(), status: 'warning', message: 'ทำรายการซ้ำ (ภายใน 1 นาที)', student: student, time: timeString });
            return;
          }
        }

        if (student) {
          let logStatus = manualStatus || 'success';
          let logMessage = logStatus === 'success' ? 'บันทึกเข้าเรียน' : logStatus === 'leave' ? 'บันทึกการลา' : 'ขาดเรียน';

          playBeep('success');
          const filteredLogs = manualStatus ? logs.filter(l => l.student?.id !== student.id) : logs;
          const newLog = { id: Math.random().toString(36).substr(2, 9), rawTime: timestamp, time: manualStatus ? 'ปรับปรุงข้อมูล' : timeString, student: student, status: logStatus };
          
          setLogs([newLog, ...filteredLogs]);
          setLastScan({ id: Math.random(), status: logStatus, message: logMessage, student: student, time: timeString });
          
          const dateKey = `${timestamp.getFullYear()}-${String(timestamp.getMonth() + 1).padStart(2, '0')}-${String(timestamp.getDate()).padStart(2, '0')}`;
          setAttendanceData(prev => ({
            ...prev,
            [student.id]: {
              ...(prev[student.id] || {}),
              [dateKey]: logStatus
            }
          }));

          if(!manualStatus) showToast(`บันทึก ${student.name} สำเร็จ`, 'success');
        } else {
          playBeep('error');
          setLogs(prev => [{ id: Math.random().toString(36).substr(2, 9), rawTime: timestamp, time: timeString, codeScanned: cleanCode, status: 'error' }, ...prev]);
          setLastScan({ id: Math.random(), status: 'error', message: 'ไม่พบข้อมูลในระบบส่วนกลาง', codeScanned: cleanCode, time: timeString });
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleProcessBarcode(barcode);
          setBarcode('');
        }
      };

      // Simulator Bot
      useEffect(() => {
        let interval;
        if (isAutoScanning) {
          interval = setInterval(() => {
            const unscannedIds = Object.keys(studentsDB).filter(id => !logs.some(l => l.student?.id === id && (l.status === 'success' || l.status === 'leave')));
            if (unscannedIds.length > 0) {
              handleProcessBarcode(unscannedIds[Math.floor(Math.random() * unscannedIds.length)]);
            } else {
              setIsAutoScanning(false);
              showToast('จำลองสถานการณ์เสร็จสิ้น', 'info');
            }
          }, 2000); 
        }
        return () => clearInterval(interval);
      }, [isAutoScanning, studentsDB, logs]);

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          setAddForm(prev => ({ ...prev, photo: url }));
        }
      };

      const handleAddSingleStudent = (e) => {
        e.preventDefault();
        if (!addForm.id || !addForm.name) {
          showToast('กรุณากรอกข้อมูลสำคัญให้ครบถ้วน', 'error');
          return;
        }
        setStudentsDB(prev => ({
          ...prev,
          [addForm.id]: {
            id: addForm.id,
            name: addForm.name,
            class: addForm.class || '-',
            number: parseInt(addForm.number) || 0,
            attendanceRate: 100,
            photo: addForm.photo
          }
        }));
        showToast(`ลงทะเบียน ${addForm.name} เข้าสู่ระบบแล้ว`, 'success');
        setAddForm({ id: '', name: '', class: '', number: '', photo: null });
      };

      const processImportData = (text) => {
        const lines = text.split('\n');
        let importedCount = 0;
        const newDB = { ...studentsDB };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const parts = line.split(',');
          if (parts.length >= 4) {
            const id = parts[0]?.trim();
            const name = parts[1]?.trim();
            const className = parts[2]?.trim();
            const number = parseInt(parts[3]?.trim(), 10) || 0;
            if (id && name && id !== 'รหัสนักเรียน' && id !== 'รหัส') {
              newDB[id] = { id, name, class: className, number, attendanceRate: 100, photo: null };
              importedCount++;
            }
          }
        }
        if (importedCount > 0) {
          setStudentsDB(newDB);
          setImportText('');
          showToast(`นำเข้าข้อมูลบุคลากรสำเร็จ ${importedCount} รายการ`, 'success');
        } else {
          showToast('โครงสร้างข้อมูลไม่ถูกต้อง กรุณาตรวจสอบ', 'error');
        }
      };

      const handleCellEdit = (id, field, value) => {
        setStudentsDB(prev => ({
          ...prev,
          [id]: {
            ...prev[id],
            [field]: field === 'number' || field === 'attendanceRate' ? (parseInt(value) || 0) : value
          }
        }));
      };

      const handleDownloadTemplate = () => {
        const headers = "รหัสประจำตัว,ชื่อ-นามสกุล,ระดับชั้น,เลขที่\n";
        const sample = "1001,เด็กชายสมชาย มุ่งมั่น,ม.1/1,1\n1002,เด็กหญิงสมหญิง รักเรียน,ม.1/1,2";
        const blob = new Blob(["\uFEFF" + headers + sample], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "student_template.csv";
        link.click();
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          const lines = text.split('\n');
          // ถ้ามีบรรทัดหัวข้อ (Header) ให้ตัดทิ้ง
          if (lines.length > 0 && (lines[0].includes('รหัส') || lines[0].includes('id'))) {
             lines.shift();
          }
          processImportData(lines.join('\n'));
        };
        reader.readAsText(file);
        e.target.value = ''; 
      };

      const handleAttendanceCellToggle = (studentId, dateKey) => {
        setAttendanceData(prev => {
          const currentStatus = prev[studentId]?.[dateKey];
          let nextStatus = '';
          if (!currentStatus) nextStatus = 'success';
          else if (currentStatus === 'success') nextStatus = 'leave';
          else if (currentStatus === 'leave') nextStatus = 'error'; // ใช้ error แทน ขาดเรียน
          else nextStatus = ''; 

          return {
            ...prev,
            [studentId]: {
              ...(prev[studentId] || {}),
              [dateKey]: nextStatus
            }
          };
        });
      };

      const renderScanner = () => (
        <div className="flex flex-col lg:flex-row gap-8 animate-fade-in" onClick={() => {if(inputRef.current) inputRef.current.focus()}}>
          
          {/* ซ้าย: เครื่องสแกนและผลล่าสุด */}
          <div className="w-full lg:w-5/12 flex flex-col gap-6">
            
            {/* กล่องรับสัญญาณสแกน (Redesigned for Enterprise) */}
            <div className={`premium-card overflow-hidden relative transition-all duration-300 ${isFocused ? 'ring-2 ring-blue-500 ring-offset-2' : 'opacity-90'}`}>
              <div className={`px-6 py-4 flex justify-between items-center ${isFocused ? 'bg-blue-50 border-b border-blue-100' : 'bg-slate-100 border-b border-slate-200'}`}>
                <div className="flex items-center gap-3">
                  <div className={`status-pulse ${isFocused ? 'active' : 'inactive'}`}><div className="dot"></div></div>
                  <h3 className="font-prompt font-semibold text-slate-800 tracking-wide">{isFocused ? 'พร้อมรับสัญญาณจากอุปกรณ์' : 'ระบบหยุดการรับสัญญาณ'}</h3>
                </div>
                <i className={`fa-solid fa-barcode text-xl ${isFocused ? 'text-blue-500' : 'text-slate-400'}`}></i>
              </div>
              <div className="p-8 flex flex-col items-center">
                <input
                  ref={inputRef}
                  type="text"
                  value={barcode}
                  onChange={(e) => setBarcode(e.target.value)}
                  onKeyDown={handleKeyDown}
                  onFocus={() => setIsFocused(true)}
                  onBlur={() => { setIsFocused(false); setTimeout(() => { if (inputRef.current) inputRef.current.focus(); }, 100); }}
                  placeholder="สแกนบัตรประจำตัว..."
                  className="w-full text-center text-3xl font-bold tracking-widest text-slate-800 placeholder-slate-300 border-none outline-none bg-transparent"
                  autoComplete="off"
                  autoFocus
                />
                <div className="w-full h-1 bg-slate-100 mt-6 rounded-full overflow-hidden relative">
                   <div className={`absolute top-0 left-0 h-full w-full bg-blue-500 ${isFocused ? 'animate-[pulse_1.5s_ease-in-out_infinite]' : 'opacity-0'}`}></div>
                </div>
              </div>
            </div>

            {/* ผลการสแกนล่าสุด (ID Card Popup Style) */}
            <div className="premium-card flex-1 flex flex-col min-h-[380px]">
              <div className="px-6 py-4 border-b border-slate-100">
                <h3 className="font-prompt font-semibold text-slate-700 text-sm tracking-wider uppercase text-center">ข้อมูลรายการล่าสุด</h3>
              </div>
              <div className="flex-1 flex flex-col items-center justify-center p-6 bg-slate-50/50">
                {!lastScan ? (
                  <div className="text-center text-slate-400">
                    <i className="fa-regular fa-id-badge text-6xl mb-4 opacity-50"></i>
                    <p className="font-prompt text-sm">รอทำรายการ...</p>
                  </div>
                ) : (
                  <div key={lastScan.id} className="w-full max-w-sm animate-slide-up bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col items-center text-center">
                    {lastScan.status === 'success' && (
                      <>
                        <div className="relative">
                          {lastScan.student.photo ? (
                            <img src={lastScan.student.photo} alt="profile" className="w-32 h-32 rounded-full object-cover border-4 border-white shadow-md mb-4" />
                          ) : (
                            <div className="w-24 h-24 rounded-full bg-blue-50 flex items-center justify-center mb-4 shadow-sm">
                               <i className="fa-solid fa-user-check text-4xl text-blue-500"></i>
                            </div>
                          )}
                          <div className="absolute -bottom-2 -right-2 bg-emerald-500 text-white w-10 h-10 rounded-full flex items-center justify-center border-4 border-white shadow-sm">
                            <i className="fa-solid fa-check"></i>
                          </div>
                        </div>
                        <h2 className="text-2xl font-prompt font-bold text-slate-800 mt-2 mb-1">{lastScan.student.name}</h2>
                        <p className="text-slate-500 font-medium mb-4">รหัส {lastScan.student.id} &bull; {lastScan.student.class} เลขที่ {lastScan.student.number}</p>
                        <div className="w-full bg-slate-50 rounded-lg py-3 flex items-center justify-center gap-2 border border-slate-100">
                          <i className="fa-regular fa-clock text-slate-400"></i>
                          <span className="font-prompt font-semibold text-slate-700">{lastScan.time}</span>
                        </div>
                      </>
                    )}
                    {lastScan.status === 'warning' && (
                      <>
                        <div className="w-24 h-24 rounded-full bg-amber-50 flex items-center justify-center mb-4"><i className="fa-solid fa-triangle-exclamation text-4xl text-amber-500"></i></div>
                        <h2 className="text-xl font-prompt font-bold text-amber-600 mb-2">{lastScan.message}</h2>
                        <p className="text-slate-600">{lastScan.student.name}</p>
                      </>
                    )}
                    {lastScan.status === 'error' && (
                      <>
                         <div className="w-24 h-24 rounded-full bg-rose-50 flex items-center justify-center mb-4"><i className="fa-solid fa-circle-xmark text-4xl text-rose-500"></i></div>
                        <h2 className="text-xl font-prompt font-bold text-rose-600 mb-2">{lastScan.message}</h2>
                        <p className="font-mono text-slate-500 bg-slate-100 px-4 py-2 rounded-lg mt-2">CODE: {lastScan.codeScanned}</p>
                      </>
                    )}
                  </div>
                )}
              </div>
            </div>

            {/* เครื่องมือจำลอง */}
            <div className="mt-auto">
              <button onClick={() => setIsAutoScanning(!isAutoScanning)} className={`w-full py-3.5 rounded-xl font-prompt font-medium text-sm transition-all shadow-sm flex justify-center items-center gap-2 ${isAutoScanning ? 'bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:border-blue-300'}`}>
                <i className={`fa-solid ${isAutoScanning ? 'fa-stop' : 'fa-robot'}`}></i> 
                {isAutoScanning ? 'ยุติการจำลองสถานการณ์' : 'เครื่องมือจำลองอัตโนมัติ (Simulation)'}
              </button>
            </div>
          </div>

          {/* ขวา: Log Table (Modern Data Grid) */}
          <div className="w-full lg:w-7/12 premium-card flex flex-col h-[calc(100vh-140px)]">
            <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white rounded-t-[16px]">
              <div>
                <h2 className="font-prompt font-bold text-lg text-slate-800">บันทึกเวลาปฏิบัติการ (Real-time Logs)</h2>

                  </div>
                  <p className="font-prompt font-medium text-slate-800 mb-1">คลิกหรือลากไฟล์มาวางที่นี่</p>
                  <p className="text-xs text-slate-500 font-prompt">รองรับไฟล์ .csv (บันทึกจาก Excel)</p>
                </div>
              </div>

              <div className="flex flex-col gap-4">
                <h3 className="font-prompt font-semibold text-slate-700 border-b border-slate-200 pb-2 flex items-center gap-2">
                  <i className="fa-solid fa-keyboard text-blue-500"></i> วิธีที่ 2: คัดลอกและวาง (Manual)
                </h3>
                <textarea 
                  className="flex-1 w-full border border-slate-300 rounded-xl p-5 font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none bg-slate-50 focus:bg-white transition-shadow h-48"
                  placeholder="วางข้อมูลที่คัดลอกมาลงที่นี่..."
                  value={importText}
                  onChange={(e) => setImportText(e.target.value)}
                ></textarea>
                <button 
                  onClick={() => processImportData(importText)}
                  className="w-full py-3 bg-slate-800 text-white rounded-xl font-prompt font-medium hover:bg-slate-700 transition-colors shadow-sm"
                >ประมวลผลข้อมูล</button>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex overflow-hidden bg-slate-50">
          
          {/* Modern Toast Notification */}
          {toast && (
            <div className="fixed bottom-8 right-8 z-50 animate-slide-up">
              <div className="bg-slate-800 text-white px-5 py-3.5 rounded-xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] border border-slate-700 flex items-center gap-3">
                {toast.type === 'success' ? <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i> : 
                 toast.type === 'error' ? <i className="fa-solid fa-circle-exclamation text-rose-400 text-lg"></i> :
                 <i className="fa-solid fa-circle-info text-blue-400 text-lg"></i>}
                <span className="font-prompt font-medium text-sm">{toast.message}</span>
              </div>
            </div>
          )}

          {/* Premium Sidebar */}
          <aside className="w-72 bg-[#0f172a] text-slate-300 flex flex-col border-r border-slate-800 z-20 shrink-0">
            <div className="h-20 border-b border-slate-800/50 px-6 flex items-center gap-4">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <i className="fa-solid fa-building-columns text-lg"></i>
              </div>
              <div>
                <h1 className="text-white font-prompt font-bold text-lg leading-tight tracking-wide">EduTrack</h1>
                <p className="text-[10px] uppercase tracking-widest text-blue-400 font-semibold">Enterprise Edition</p>
              </div>
            </div>
            
            <div className="px-4 py-6 text-xs font-semibold text-slate-500 uppercase tracking-widest mb-2">Main Menu</div>
            <nav className="flex-1 px-3 flex flex-col gap-1.5">
              <button onClick={() => setActiveTab('scan')} className={`nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-sm font-medium ${activeTab === 'scan' ? 'bg-blue-600/10 text-blue-400 border border-blue-500/20' : 'hover:bg-slate-800/50 hover:text-slate-200 border border-transparent'}`}>
                <i className="fa-solid fa-barcode w-5 text-center"></i> ศูนย์รับสแกนข้อมูล
              </button>
              <button onClick={() => setActiveTab('dashboard')} className={`nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-sm font-medium ${activeTab === 'dashboard' ? 'bg-blue-600/10 text-blue-400 border border-blue-500/20' : 'hover:bg-slate-800/50 hover:text-slate-200 border border-transparent'}`}>
                <i className="fa-solid fa-chart-pie w-5 text-center"></i> รายงานสถานะรายวัน
              </button>
              <button onClick={() => setActiveTab('yearly')} className={`nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-sm font-medium ${activeTab === 'yearly' ? 'bg-blue-600/10 text-blue-400 border border-blue-500/20' : 'hover:bg-slate-800/50 hover:text-slate-200 border border-transparent'}`}>
                <i className="fa-solid fa-table-list w-5 text-center"></i> สถิติภาพรวม (Spreadsheet)
              </button>
              
              <div className="px-4 py-6 text-xs font-semibold text-slate-500 uppercase tracking-widest mt-4 mb-2">System</div>
              <button onClick={() => setActiveTab('import')} className={`nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-sm font-medium ${activeTab === 'import' ? 'bg-blue-600/10 text-blue-400 border border-blue-500/20' : 'hover:bg-slate-800/50 hover:text-slate-200 border border-transparent'}`}>
                <i className="fa-solid fa-database w-5 text-center"></i> จัดการฐานข้อมูล
              </button>
            </nav>
            
            <div className="p-6 border-t border-slate-800/50 mt-auto">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 border border-slate-600"><i className="fa-solid fa-user-tie text-xs"></i></div>
                <div>
                  <div className="text-sm font-prompt font-medium text-slate-200">ผู้ดูแลระบบ</div>
                  <div className="text-xs text-emerald-400 flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400 block"></span> ออนไลน์</div>
                </div>
              </div>
            </div>
          </aside>
          
          {/* Main App Area */}
          <main className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
            {/* Top Header */}
            <header className="h-20 bg-white border-b border-slate-200 px-8 flex justify-between items-center z-10">
              <div>
                <h2 className="text-2xl font-prompt font-bold text-slate-800 tracking-tight">
                  {activeTab === 'scan' && 'ระบบรับข้อมูลแบบต่อเนื่อง (Kiosk Mode)'}
                  {activeTab === 'dashboard' && 'ระบบประมวลผลและรายงาน'}
                  {activeTab === 'yearly' && 'สถิติการปฏิบัติตามระเบียบ'}
                  {activeTab === 'import' && 'ตั้งค่าฐานข้อมูลองค์กร'}
                </h2>
              </div>
              <div className="flex items-center gap-4">
                <div className="hidden md:flex bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg text-sm font-prompt font-medium text-slate-600 items-center gap-2">
                  <i className="fa-regular fa-calendar text-blue-500"></i>
                  {new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}
                </div>
              </div>
            </header>
            
            {/* Scrollable Content */}
            <div className="flex-1 overflow-auto p-6 lg:p-8">
              {activeTab === 'scan' && renderScanner()}
              {activeTab === 'dashboard' && renderDashboard()}
              {activeTab === 'yearly' && renderSpreadsheet()}
              {activeTab === 'import' && renderImport()}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
