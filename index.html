<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School OS: EduTrack x GradePro</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Charts -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'], display: ['Prompt', 'sans-serif'] },
                    colors: { primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; color: #334155; -webkit-font-smoothing: antialiased; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 40px -10px rgba(15, 23, 42, 0.08); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scan-active { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 30px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .is-scanning .scanner-ring { animation: scan-active 2s infinite; border-color: rgba(59, 130, 246, 0.5); }
        .scanner-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; border-radius: 50%; border: 2px solid transparent; pointer-events: none; }
        
        .sticky-col { position: sticky; background-color: #ffffff; z-index: 40; } 
        .sticky-left-0 { left: 0; width: 40px; min-width: 40px; border-right: 1px solid #e2e8f0; }
        .sticky-left-1 { left: 40px; width: 80px; min-width: 80px; border-right: 1px solid #e2e8f0; }
        .sticky-left-2 { left: 120px; width: 180px; min-width: 180px; border-right: 1px solid #e2e8f0; box-shadow: 4px 0 6px -4px rgba(0,0,0,0.1); }
        thead { z-index: 50; position: sticky; top: 0; }
        thead th { background-color: #f8fafc; }
        thead .sticky-col { z-index: 60; background-color: #f8fafc; } 
        tr:nth-child(even) .sticky-col { background-color: #ffffff; }
        tr:nth-child(odd) .sticky-col { background-color: #f8fafc; } 
        tr:hover .sticky-col { background-color: #eff6ff; }
        .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; text-align: left; height: 120px; padding: 4px; display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; }

        @media print {
            body { background: white; margin: 0; overflow: visible; height: auto; }
            .no-print, nav, aside, header { display: none !important; }
            .print-only { display: block !important; width: 100%; font-family: 'Sarabun', sans-serif !important; color: #000; }
            #root, main, .overflow-y-auto, .overflow-auto { overflow: visible !important; height: auto !important; max-height: none !important; position: static !important; }
            table { width: 100%; border-collapse: collapse; page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            th, td { border: 1px solid #000 !important; padding: 4px; text-align: center; font-size: 10pt; }
            th { background-color: #e5e7eb !important; font-weight: bold; }
            @page { margin: 10mm; size: A4 landscape; } 
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, onSnapshot, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE SETUP ---
        const envConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const firebaseConfig = envConfig || { apiKey: "demo", authDomain: "demo", projectId: "demo", appId: "1:demo" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-enterprise-system'; 

        // --- CONSTANTS ---
        const DEFAULT_MASTER = { 
            school: 'โรงเรียนเตรียมอุดมศึกษานวัตกรรม', 
            adminPassword: 'admin',
            currentTerm: '1',
            currentYear: '2568',
            teachers: [{ id: 't1', name: 'อ.สมศรี ใจดี', pin: '1234', homeroom: 'ม.4/1' }, { id: 't2', name: 'อ.วิชาญ เก่งการ', pin: '5678', homeroom: 'ม.4/2' }], 
            courses: [{ id: 'c1', code: 'ว30242', name: 'ฟิสิกส์ประยุกต์', teacherId: 't1' }, { id: 'c2', code: 'ค31101', name: 'คณิตศาสตร์เพิ่มเติม', teacherId: 't2' }] 
        };
        const DEFAULT_GRADING = { '4': 80, '3.5': 75, '3': 70, '2.5': 65, '2': 60, '1.5': 55, '1': 50 };
        const SECTION_COLORS = [{ bg: 'bg-indigo-100', text: 'text-indigo-800' }, { bg: 'bg-rose-100', text: 'text-rose-800' }, { bg: 'bg-emerald-100', text: 'text-emerald-800' }, { bg: 'bg-amber-100', text: 'text-amber-800' }];

        // --- AUDIO ENGINE ---
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'success') { osc.type='sine'; osc.frequency.setValueAtTime(880, ctx.currentTime); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.2); osc.start(); osc.stop(ctx.currentTime+0.2); }
                else if (type === 'error') { osc.type='sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.4); osc.start(); osc.stop(ctx.currentTime+0.4); }
                else if (type === 'streak') { osc.type='square'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.setValueAtTime(880, ctx.currentTime+0.1); gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3); osc.start(); osc.stop(ctx.currentTime+0.3); }
            } catch(e) {}
        };

        const Icon = ({ name, size=20, className="", onClick }) => <i onClick={onClick} className={`ph ph-${name} ${className}`} style={{ fontSize: size, cursor: onClick?'pointer':'inherit' }}></i>;

        // --- CALCULATION ENGINES ---
        const calculateAutoScore = (s, g, c) => {
            if (!g.columns) return '-'; let total = 0, max = 0;
            g.columns.filter(cl => (cl.type === 'manual' || cl.type === 'check') && cl.published !== false).forEach(cl => {
                let v = s.scores?.[cl.id]; let pVal = cl.type === 'check' ? (v ? parseFloat(cl.max || 0) : 0) : parseFloat(v || 0);
                total += pVal; max += parseFloat(cl.max || 0);
            });
            if (c.type === 'sum') return Math.ceil(total);
            if (c.type === 'percent') return max === 0 ? 0 : Math.ceil((total / max) * (c.max || 100));
            return '-';
        };

        const calculateTotalScoreCustom = (student, sectionsArray) => {
            let totalPercent = 0, hasPercent = false, totalManual = 0;
            (sectionsArray || []).forEach(s => {
                s.groups?.forEach(g => {
                    g.columns?.forEach(c => {
                        if (c.type === 'percent') {
                            let total = 0, max = 0;
                            g.columns.filter(cl => (cl.type === 'manual' || cl.type === 'check')).forEach(cl => {
                                let v = student.scores?.[cl.id]; let pVal = cl.type === 'check' ? (v ? parseFloat(cl.max || 0) : 0) : parseFloat(v || 0);
                                total += pVal; max += parseFloat(cl.max || 0);
                            });
                            let val = max === 0 ? 0 : Math.ceil((total / max) * (c.max || 100));
                            totalPercent += parseFloat(val); hasPercent = true;
                        } else if (c.type === 'manual') { totalManual += parseFloat(student.scores?.[c.id] || 0);
                        } else if (c.type === 'check') { totalManual += student.scores?.[c.id] ? parseFloat(c.max || 0) : 0; }
                    });
                });
            });
            return Math.ceil(hasPercent ? totalPercent : totalManual) || 0;
        };

        const calculateTotalMaxScore = (sectionsArray) => {
            let totalPercent = 0, hasPercent = false, totalManual = 0;
            sectionsArray.forEach(s => {
                if (s.published === false) return;
                s.groups?.forEach(g => {
                    if (g.published === false) return;
                    g.columns?.forEach(c => {
                        if (c.published === false) return;
                        if (c.type === 'percent') { totalPercent += parseFloat(c.max || 100); hasPercent = true; } 
                        else if (c.type === 'manual' || c.type === 'check') { totalManual += parseFloat(c.max || 0); }
                    });
                });
            });
            return Math.ceil(hasPercent ? totalPercent : totalManual) || 100;
        };

        const calculateGradeCustom = (score, grading) => {
            const g = grading || DEFAULT_GRADING;
            if(score >= g['4']) return 4; if(score >= g['3.5']) return 3.5; if(score >= g['3']) return 3; if(score >= g['2.5']) return 2.5;
            if(score >= g['2']) return 2; if(score >= g['1.5']) return 1.5; if(score >= g['1']) return 1; return 0;
        };

        // --- COMPONENTS ---
        function Modal({ isOpen, title, children, onClose }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl w-full max-w-lg animate-scale overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50"><h3 className="font-bold text-lg font-display">{title}</h3><button onClick={onClose} className="text-slate-400 hover:bg-slate-200 p-1 rounded-full"><Icon name="x"/></button></div>
                        <div className="p-6 overflow-y-auto flex-1">{children}</div>
                    </div>
                </div>
            );
        }

        // --- MAIN APPLICATION ---
        function App() {
            const { useState, useEffect, useRef, useMemo } = React;
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [modal, setModal] = useState(null);

            // App State
            const [view, setView] = useState('portal'); // portal, login, teacher_home, homeroom_detail, course_detail, admin
            const [loggedUser, setLoggedUser] = useState(null);
            const [masterData, setMasterData] = useState(DEFAULT_MASTER);
            
            // Admin State
            const [adminTab, setAdminTab] = useState('general'); // general, personnel, academic, database

            // Login State
            const [loginTab, setLoginTab] = useState('teacher');
            const [loginId, setLoginId] = useState('');
            const [loginPin, setLoginPin] = useState('');
            const [adminPwd, setAdminPwd] = useState('');

            // Homeroom State
            const [homeroomData, setHomeroomData] = useState({ students: [], courses: [] });

            // Course Workspace State
            const [activeCourseId, setActiveCourseId] = useState(null);
            const [courseTab, setCourseTab] = useState('scan'); // scan, scores, sheet, dashboard, settings
            const [students, setStudents] = useState([]);
            const [sections, setSections] = useState([]);
            const [courseConfig, setCourseConfig] = useState({ grading: DEFAULT_GRADING, showGrade: false });
            const [logs, setLogs] = useState([]);
            
            // UI States
            const [barcode, setBarcode] = useState('');
            const [isFocused, setIsFocused] = useState(true);
            const [lastScan, setLastScan] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const today = new Date();
            const [selectedMonth, setSelectedMonth] = useState(today.getMonth());
            const [selectedYear, setSelectedYear] = useState(today.getFullYear());
            const inputRef = useRef(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Parent Portal
            const [parentSearchId, setParentSearchId] = useState('');
            const [parentResult, setParentResult] = useState(null);
            const [isSearchingParent, setIsSearchingParent] = useState(false);

            const showToast = (msg, type='success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };

            // 1. Auth & Master Listener
            useEffect(() => {
                const initAuth = async () => { try { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token); else await signInAnonymously(auth); } catch(e){} };
                initAuth();
                return onAuthStateChanged(auth, u => { setUser(u); if(!u) setLoading(false); });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMaster = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'master', 'info'), (d) => {
                    if (d.exists()) { setMasterData(d.data()); setLoading(false); } else { setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'master', 'info'), DEFAULT_MASTER); }
                });
                return unsubMaster;
            }, [user]);

            // Homeroom Listener
            useEffect(() => {
                if (view !== 'homeroom_detail' || !loggedUser?.homeroom || !masterData.courses) return;
                let isMounted = true;
                const fetchHR = async () => {
                    const sMap = {}; const cList = [];
                    for (const c of masterData.courses) {
                        try {
                            const sSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', `students_${c.id}`));
                            const configSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', `config_${c.id}`, 'main'));
                            const config = configSnap.exists() ? configSnap.data() : { sections: [], grading: DEFAULT_GRADING, showGrade: false };
                            
                            let hasStudent = false;
                            sSnap.forEach(d => {
                                const s = d.data();
                                if (s.room === loggedUser.homeroom) {
                                    hasStudent = true;
                                    if (!sMap[s.id]) sMap[s.id] = { id: s.id, name: s.name, no: s.no, scores: {}, grades: {} };
                                    const score = calculateTotalScoreCustom(s, config.sections);
                                    sMap[s.id].scores[c.id] = score;
                                    sMap[s.id].grades[c.id] = config.showGrade ? calculateGradeCustom(score, config.grading) : 'รอประกาศ';
                                }
                            });
                            if (hasStudent) cList.push(c);
                        } catch(e) {}
                    }
                    if(isMounted) setHomeroomData({ students: Object.values(sMap).sort((a,b)=>(parseInt(a.no)||0)-(parseInt(b.no)||0)), courses: cList });
                };
                fetchHR();
                return () => { isMounted = false; };
            }, [view, loggedUser, masterData.courses]);

            // 2. Course Workspace Listener (GradePro + EduTrack Data)
            useEffect(() => {
                if (!user || !activeCourseId || view !== 'course_detail') return;
                
                const unsubConfig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `config_${activeCourseId}`, 'main'), (d) => {
                    if (d.exists()) { const data = d.data(); setSections(data.sections || []); setCourseConfig({ grading: data.grading || DEFAULT_GRADING, showGrade: data.showGrade || false }); }
                    else { setDoc(doc(db, 'artifacts', appId, 'public', 'data', `config_${activeCourseId}`, 'main'), { sections: [], grading: DEFAULT_GRADING, showGrade: false }); }
                });
                
                const unsubStudents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `students_${activeCourseId}`), (snap) => {
                    const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() })); setStudents(list.sort((a,b) => (parseInt(a.no)||0) - (parseInt(b.no)||0)));
                });

                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `logs_${activeCourseId}`), (snap) => {
                    const l = []; snap.forEach(doc => l.push({ docId: doc.id, ...doc.data() })); setLogs(l.sort((a,b) => b.rawTime - a.rawTime));
                });

                return () => { unsubConfig(); unsubStudents(); unsubLogs(); };
            }, [user, activeCourseId, view]);

            // Scanner Auto-focus
            useEffect(() => {
                let interval; if (view === 'course_detail' && courseTab === 'scan') { interval = setInterval(() => { if (document.activeElement !== inputRef.current && inputRef.current) inputRef.current.focus(); }, 500); }
                return () => clearInterval(interval);
            }, [view, courseTab]);

            // Chart.js (AI Dashboard)
            useEffect(() => {
                if (view === 'course_detail' && courseTab === 'dashboard' && chartRef.current && students.length > 0) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    const tStr = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                    const present = students.filter(s => s.attendance?.[tStr] === 'success').length;
                    const late = students.filter(s => s.attendance?.[tStr] === 'late').length;
                    const leave = students.filter(s => s.attendance?.[tStr] === 'leave').length;
                    const absent = students.length - present - late - leave;

                    chartInstance.current = new Chart(ctx, { type: 'doughnut', data: { labels: ['มา', 'สาย', 'ลา', 'ขาด'], datasets: [{ data: [present, late, leave, absent], backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#f43f5e'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { family: 'Prompt' } } } }, cutout: '75%' } });
                }
            }, [view, courseTab, students, selectedMonth, selectedYear]);

            // --- DATA HANDLers ---
            const saveMasterData = async (newData) => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'master', 'info'), newData, { merge: true }); };
            
            const updateStudent = async (id, data) => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `students_${activeCourseId}`, id), data, { merge: true }); };
            
            const saveCourseConfigData = async (newSecs, newGrading, newShowGrade) => {
                const payload = {}; if(newSecs !== null) payload.sections = newSecs; if(newGrading !== null) payload.grading = newGrading; if(newShowGrade !== null) payload.showGrade = newShowGrade;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `config_${activeCourseId}`, 'main'), payload, { merge: true });
            };

            const handleScanBarcode = () => {
                const code = barcode.trim(); if (!code) return;
                const student = students.find(s => s.id === code);
                const t = new Date(); const tStr = t.toLocaleTimeString('th-TH');
                
                const isSpam = logs.find(l => l.student?.id === code && (t.getTime() - l.rawTime) < 60000 && l.status === 'success');
                if (isSpam) { playSound('error'); showToast(`สแกนซ้ำ: ${student.name}`, 'error'); setBarcode(''); return; }

                if (student) {
                    const newStreak = (student.streak || 0) + 1;
                    if(newStreak % 5 === 0) playSound('streak'); else playSound('success');
                    const dStr = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
                    
                    addDoc(collection(db, 'artifacts', appId, 'public', 'data', `logs_${activeCourseId}`), { rawTime: t.getTime(), time: tStr, student: { id: student.id, name: student.name, room: student.room, no: student.no }, status: 'success' });
                    updateStudent(student.id, { streak: newStreak, [`attendance.${dStr}`]: 'success' });
                    setLastScan({ status: 'success', student: { ...student, streak: newStreak }, time: tStr });
                    if(newStreak % 5 === 0) showToast(`🔥 Streak! ${student.name} มาเรียน ${newStreak} วันติด`, 'success');
                } else {
                    playSound('error');
                    addDoc(collection(db, 'artifacts', appId, 'public', 'data', `logs_${activeCourseId}`), { rawTime: t.getTime(), time: tStr, codeScanned: code, status: 'error' });
                    setLastScan({ status: 'error', codeScanned: code, time: tStr });
                }
                setBarcode('');
            };

            const handleParentSearch = async () => {
                if(!parentSearchId.trim()) return showToast('กรุณากรอกรหัสนักเรียน', 'error');
                setIsSearchingParent(true); setParentResult(null);
                const res = [];
                for (const c of masterData.courses || []) {
                    const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', `students_${c.id}`, parentSearchId.trim()));
                    if (snap.exists()) {
                        const cfgSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', `config_${c.id}`, 'main'));
                        const cfg = cfgSnap.exists() ? cfgSnap.data() : { sections: [], grading: DEFAULT_GRADING, showGrade: false };
                        const sData = snap.data();
                        const score = calculateTotalScoreCustom(sData, cfg.sections);
                        res.push({ course: c, student: sData, totalScore: score, grade: cfg.showGrade ? calculateGradeCustom(score, cfg.grading) : 'รอประกาศ' });
                    }
                }
                setIsSearchingParent(false);
                if (res.length > 0) { setParentResult(res); showToast('ดึงข้อมูลเรียบร้อย'); } else { showToast('ไม่พบข้อมูลนักเรียนรหัสนี้', 'error'); }
            };

            const handleBatchImport = async (text, targetCourseId) => {
                const lines = text.split('\n'); let c = 0; const batch = writeBatch(db);
                for (let i = 1; i < lines.length; i++) { // Skip header
                    const p = lines[i].split(',');
                    if (p.length >= 4) {

                            <div className="flex items-center gap-3"><div className="h-px bg-slate-200 flex-1"></div><div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">หรือวางข้อมูลด้วยตัวเอง</div><div className="h-px bg-slate-200 flex-1"></div></div>
                            <textarea className="w-full h-32 border border-slate-200 rounded-xl p-3 text-sm font-mono bg-slate-50 outline-none focus:border-blue-500 placeholder-slate-300 shadow-inner" placeholder="รหัส,ชื่อ-สกุล,ห้อง,เลขที่&#10;1001,ด.ช.สมชาย,1/1,1..." id="importText"></textarea>
                            <button onClick={()=>handleBatchImport(document.getElementById('importText').value, modal.courseId || activeCourseId)} className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 hover:bg-blue-700 transition active:scale-95 flex items-center justify-center gap-2"><Icon name="database" /> เริ่มนำเข้าและบันทึกสู่ระบบ Cloud</button>
                        </div>
                    </Modal>

                    <Modal isOpen={modal?.type === 'confirm'} title={modal?.title} onClose={() => setModal(null)}>
                        <p className="text-slate-600 mb-6">{modal?.message}</p>
                        <div className="flex gap-3 justify-end">
                            <button onClick={() => setModal(null)} className="px-5 py-2 text-slate-600 hover:bg-slate-100 rounded-xl font-bold transition">ยกเลิก</button>
                            <button onClick={modal?.onConfirm} className="px-5 py-2 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 shadow-md transition">ยืนยันทำรายการ</button>
                        </div>
                    </Modal>

                    {view !== 'portal' && view !== 'login' && renderSidebar()}

                    <main className="flex-1 w-full relative z-0 no-print overflow-hidden">
                        {view === 'portal' && (
                            <div className="h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 to-slate-900 text-white flex-col relative overflow-hidden">
                                <div className="absolute top-1/4 right-1/4 w-96 h-96 bg-purple-500/20 blur-[100px] rounded-full pointer-events-none"></div>
                                <Icon name="users-three" size={80} className="mb-6 text-indigo-300 opacity-80"/>
                                <h1 className="text-5xl font-bold font-display tracking-tight mb-3 z-10">Parent Portal</h1>
                                <p className="text-indigo-200 mb-8 z-10 text-lg">ตรวจสอบคะแนนและพฤติกรรมการเข้าเรียน</p>
                                <div className="flex gap-2 z-10 w-full max-w-md px-6">
                                    <input className="flex-1 py-4 px-6 rounded-2xl bg-white/10 border border-white/20 text-white placeholder-indigo-300 text-lg outline-none focus:ring-2 focus:ring-indigo-400 backdrop-blur-md text-center font-mono tracking-widest" placeholder="รหัสนักเรียน 4-5 หลัก" value={parentSearchId} onChange={e=>setParentSearchId(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleParentSearch()}/>
                                    <button onClick={handleParentSearch} disabled={isSearchingParent} className="bg-indigo-500 hover:bg-indigo-600 text-white px-8 rounded-2xl font-bold transition shadow-lg flex items-center justify-center w-32">{isSearchingParent ? <Icon name="spinner" className="animate-spin"/> : 'ค้นหา'}</button>
                                </div>
                                <button onClick={()=>setView('login')} className="mt-12 text-sm text-indigo-400 hover:text-white transition z-10">สลับไปหน้าบุคลากร</button>
                                
                                {parentResult && (
                                    <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-50 overflow-y-auto p-6 flex flex-col animate-fade-in">
                                        <div className="max-w-4xl w-full mx-auto mt-10">
                                            <button onClick={()=>{setParentResult(null);setParentSearchId('');}} className="mb-6 text-indigo-300 hover:text-white flex items-center gap-2 font-bold"><Icon name="arrow-left"/> กลับไปค้นหา</button>
                                            <div className="bg-white/10 border border-white/20 rounded-[2rem] p-8 flex flex-col md:flex-row gap-8 items-center md:items-start mb-8 shadow-2xl">
                                                <div className="w-32 h-32 bg-indigo-500/30 rounded-full flex items-center justify-center border-4 border-indigo-400/50 shadow-inner text-white"><Icon name="user" size={60}/></div>
                                                <div className="text-center md:text-left flex-1">
                                                    <h2 className="text-3xl font-bold font-display mb-2">{parentResult[0].student.name}</h2>
                                                    <div className="flex flex-wrap gap-2 justify-center md:justify-start mb-6">
                                                        <span className="bg-white/10 px-3 py-1 rounded-lg text-sm font-mono">ID: {parentResult[0].student.id}</span>
                                                        <span className="bg-white/10 px-3 py-1 rounded-lg text-sm">ชั้น {parentResult[0].student.room}</span>
                                                        <span className="bg-white/10 px-3 py-1 rounded-lg text-sm">เลขที่ {parentResult[0].student.no}</span>
                                                    </div>
                                                    <div className="bg-orange-500/20 border border-orange-500/30 text-orange-300 px-5 py-3 rounded-2xl inline-flex items-center gap-3">
                                                        <Icon name="fire" size={24} className="text-orange-400"/>
                                                        <div className="text-left"><div className="text-[10px] uppercase font-bold tracking-wider">มาเรียนต่อเนื่อง</div><div className="text-xl font-bold leading-none">{parentResult[0].student.streak || 0} <span className="text-sm">วัน</span></div></div>
                                                    </div>
                                                </div>
                                            </div>
                                            <h3 className="text-2xl font-bold font-display mb-4">ผลการเรียนรายวิชา</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {parentResult.map((r, i) => (
                                                    <div key={i} className="bg-white rounded-2xl p-6 text-slate-800 shadow-xl">
                                                        <div className="text-xs font-mono text-slate-400 mb-1">{r.course.code}</div>
                                                        <div className="font-bold text-lg mb-4">{r.course.name}</div>
                                                        <div className="flex justify-between items-end pt-4 border-t border-slate-100">
                                                            <div><div className="text-[10px] text-slate-400 font-bold uppercase">คะแนนสะสม</div><div className="text-2xl font-bold text-slate-700">{r.totalScore}</div></div>
                                                            <div className="text-right"><div className="text-[10px] text-slate-400 font-bold uppercase">เกรดที่ได้</div><div className={`text-4xl font-display font-bold ${r.grade==='รอประกาศ'?'text-slate-300 text-xl mb-1':'text-indigo-600'}`}>{r.grade}</div></div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                        {view === 'login' && renderLogin()}
                        {view === 'teacher_home' && <div className="h-full overflow-y-auto bg-slate-50">{renderTeacherDashboard()}</div>}
                        {view === 'homeroom_detail' && <div className="h-full overflow-y-auto bg-slate-50">{renderHomeroomDetail()}</div>}
                        {view === 'admin' && <div className="h-full overflow-y-auto bg-slate-50">{renderAdminDashboard()}</div>}
                        {view === 'course_detail' && renderCourseWorkspace()}
                    </main>

                    {renderPrintTemplate()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
