<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classroom Simulator</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-200 selection:text-indigo-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ข้อมูลเริ่มต้น ---
        const INITIAL_CLASSES = [{ id: 'C01', name: 'ม.1/1 🏫' }];
        const INITIAL_SUBJECTS = [{ id: 'SUB01', name: 'คณิตศาสตร์ 📐' }];
        const INITIAL_STUDENTS = [{ id: 'STD001', number: 1, classId: 'C01', name: 'ด.ช. สมชาย รักเรียน', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Somchai&backgroundColor=c0aede' }];
        const INITIAL_ASSIGNMENTS = [{ id: 'HW01', classId: 'C01', subjectId: 'SUB01', title: 'แบบฝึกหัด 1', maxScore: 10 }];
        const INITIAL_SCHEDULE = [{ id: 'SCH01', day: 'จันทร์', startTime: '08:30', endTime: '09:20', classId: 'C01', subjectId: 'SUB01' }];
        const BEHAVIOR_PRESETS = [
          { points: 1, reason: 'ตอบคำถามได้ดี', icon: '🙋‍♂️', color: 'green' },
          { points: 1, reason: 'ช่วยเหลือเพื่อน', icon: '🤝', color: 'green' },
          { points: -1, reason: 'คุยในห้องเรียน', icon: '🗣️', color: 'red' },
          { points: -2, reason: 'เล่นมือถือขณะเรียน', icon: '📱', color: 'red' },
        ];
        const WEEK_DAYS = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์'];

        // --- ตั้งค่า Firebase Cloud Firestore ของคุณ ---
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyDIguma2wXKnY6yi0svySHVwjtmFriicbg",
            authDomain: "tp69-point.firebaseapp.com",
            projectId: "tp69-point",
            storageBucket: "tp69-point.firebasestorage.app",
            messagingSenderId: "241813486171",
            appId: "1:241813486171:web:f25c9028b71e5fdd3f1d7e",
            measurementId: "G-S58H8CX6MW"
        };

        function App() {
          const [userRole, setUserRole] = useState('guest'); 
          const [currentUser, setCurrentUser] = useState(null);
          const [loginTab, setLoginTab] = useState('teacher'); 
          const [loginForm, setLoginForm] = useState({ username: '', password: '', studentId: '' });
          
          const [fbUser, setFbUser] = useState(null);
          const [isConnected, setIsConnected] = useState(false);
          const dbRef = useRef(null);
          const firebaseLibs = useRef({});

          // --- ใช้ Cloud Firestore เป็นหลัก 100% ---
          const [classes, setClasses] = useState(INITIAL_CLASSES);
          const [subjects, setSubjects] = useState(INITIAL_SUBJECTS);
          const [students, setStudents] = useState(INITIAL_STUDENTS);
          const [assignments, setAssignments] = useState(INITIAL_ASSIGNMENTS);
          const [schedules, setSchedules] = useState(INITIAL_SCHEDULE);
          
          const [attendanceData, setAttendanceData] = useState({});
          const [assignmentData, setAssignmentData] = useState({});
          const [behaviorData, setBehaviorData] = useState({});
          
          const [activeTab, setActiveTab] = useState('schedule');
          const [currentClassId, setCurrentClassId] = useState('');
          const [currentSubjectId, setCurrentSubjectId] = useState('');
          const [barcodeInput, setBarcodeInput] = useState('');
          const [lastScanned, setLastScanned] = useState(null);
          
          const [settingsMenu, setSettingsMenu] = useState('schedule');
          const [editItem, setEditItem] = useState(null);
          const [classForm, setClassForm] = useState({ id: '', name: '' });
          const [subjectForm, setSubjectForm] = useState({ id: '', name: '' });
          const [studentForm, setStudentForm] = useState({ id: '', number: '', name: '', classId: '' });
          const [assignForm, setAssignForm] = useState({ id: '', title: '', maxScore: '', subjectId: '', classId: '' });
          const [scheduleForm, setScheduleForm] = useState({ id: '', day: 'จันทร์', startTime: '', endTime: '', classId: '', subjectId: '' });
          
          const [gradingModal, setGradingModal] = useState({ isOpen: false, student: null });
          const [behaviorModal, setBehaviorModal] = useState({ isOpen: false, student: null });
          const [randomizerModal, setRandomizerModal] = useState({ isOpen: false, result: null, spinning: false });
          const [modalScores, setModalScores] = useState({});

          const scannerInputRef = useRef(null);
          const randomIntervalRef = useRef(null);

          // --- 1. FIREBASE INIT ---
          useEffect(() => {
              const initFirebase = async () => {
                  try {
                      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                      const { getAuth, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                      const { getFirestore, doc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                      
                      const app = initializeApp(FIREBASE_CONFIG);
                      const auth = getAuth(app);
                      dbRef.current = getFirestore(app);
                      firebaseLibs.current = { doc, setDoc, onSnapshot };

                      await signInAnonymously(auth);

                      onAuthStateChanged(auth, (u) => { 
                          setFbUser(u); 
                          if(u) setIsConnected(true);
                      });
                  } catch (e) { 
                      console.error("Firebase Init Error", e); 
                  }
              };
              initFirebase();
          }, []);

          // --- 2. FIREBASE READ (ดึงข้อมูลลงมาอัตโนมัติ) ---
          useEffect(() => {
              if (!fbUser || !dbRef.current || !firebaseLibs.current.onSnapshot) return;
              const { doc, onSnapshot } = firebaseLibs.current;
              
              const unsubCore = onSnapshot(doc(dbRef.current, 'SmartClassData', 'Core'), (docSnap) => {
                  if (docSnap.exists()) {
                      const data = docSnap.data();
                      if (data.classes) setClasses(data.classes);
                      if (data.subjects) setSubjects(data.subjects);
                      if (data.students) setStudents(data.students);
                      if (data.assignments) setAssignments(data.assignments);
                      if (data.schedules) setSchedules(data.schedules);
                  }
              });

              const unsubRecords = onSnapshot(doc(dbRef.current, 'SmartClassData', 'Records'), (docSnap) => {
                  if (docSnap.exists()) {
                      const data = docSnap.data();
                      if (data.attendanceData) setAttendanceData(data.attendanceData);
                      if (data.assignmentData) setAssignmentData(data.assignmentData);
                      if (data.behaviorData) setBehaviorData(data.behaviorData);
                  }
              });

              return () => { unsubCore(); unsubRecords(); };
          }, [fbUser]);

          // --- 3. FIREBASE WRITE (บันทึกข้อมูลหลัก 100%) ---
          const syncCore = async (overrides) => {
              const payload = { classes, subjects, students, assignments, schedules, ...overrides };
              if (fbUser && dbRef.current) {
                  try { 
                      await firebaseLibs.current.setDoc(firebaseLibs.current.doc(dbRef.current, 'SmartClassData', 'Core'), payload, { merge: true }); 
                  } catch (e) { console.error("Firebase save failed", e); }
              } else {
                  console.warn("ไม่สามารถบันทึกได้: ยังไม่ได้เชื่อมต่อ Firebase");
              }
          };

          const syncRecords = async (overrides) => {
              const payload = { attendanceData, assignmentData, behaviorData, ...overrides };
              if (fbUser && dbRef.current) {
                  try { 
                      await firebaseLibs.current.setDoc(firebaseLibs.current.doc(dbRef.current, 'SmartClassData', 'Records'), payload, { merge: true }); 
                  } catch (e) { console.error("Firebase save failed", e); }
              } else {
                  console.warn("ไม่สามารถบันทึกได้: ยังไม่ได้เชื่อมต่อ Firebase");
              }
          };

          // Focus scanner auto
          useEffect(() => {
            if (userRole === 'teacher' && ['attendance', 'assignment', 'behavior'].includes(activeTab) && !gradingModal.isOpen && !behaviorModal.isOpen && !randomizerModal.isOpen) {
              if (scannerInputRef.current) scannerInputRef.current.focus();
            }
          }, [activeTab, userRole, gradingModal.isOpen, behaviorModal.isOpen, randomizerModal.isOpen, currentClassId, currentSubjectId]);

          // Set Initial Selections
          useEffect(() => {
             if(classes.length > 0 && !currentClassId) setCurrentClassId(classes[0].id);
             if(subjects.length > 0 && !currentSubjectId) setCurrentSubjectId(subjects[0].id);
             if(classes.length > 0 && !studentForm.classId) setStudentForm(prev => ({...prev, classId: classes[0].id}));
             if(classes.length > 0 && subjects.length > 0 && !assignForm.classId) setAssignForm(prev => ({...prev, classId: classes[0].id, subjectId: subjects[0].id}));
             if(classes.length > 0 && subjects.length > 0 && !scheduleForm.classId) setScheduleForm(prev => ({...prev, classId: classes[0].id, subjectId: subjects[0].id}));
          }, [classes, subjects]);

          const filteredStudents = students.filter(s => s.classId === currentClassId);
          const filteredAssignments = assignments.filter(a => a.subjectId === currentSubjectId && a.classId === currentClassId);

          const handleLogin = (e) => {
            e.preventDefault();
            if (loginTab === 'teacher') {
              if (loginForm.username === 'admin' && loginForm.password === 'password') {
                setUserRole('teacher'); setActiveTab('schedule');
              } else { alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (ลอง admin / password)'); }
            } else {
              const student = students.find(s => s.id === loginForm.studentId.toUpperCase());
              if (student) { setUserRole('student'); setCurrentUser(student); } 
              else { alert('ไม่พบรหัสนักเรียนนี้ในระบบ'); }
            }
          };

          const handleLogout = () => { setUserRole('guest'); setCurrentUser(null); setLoginForm({ username: '', password: '', studentId: '' }); };

          const handleEnterClass = (classId, subjectId) => {
              setCurrentClassId(classId); setCurrentSubjectId(subjectId); setActiveTab('attendance');
          };

          const showFeedback = (student, message, type) => {
            setLastScanned({ student, message, type });
            setTimeout(() => setLastScanned(null), 3000);
          };

          const handleScanSubmit = (e) => {
            e.preventDefault();
            const code = barcodeInput.trim().toUpperCase();
            if (!code) return;

            const student = students.find(s => s.id === code);

            if (student) {
              if (student.classId !== currentClassId) {
                showFeedback(null, `นักเรียนไม่อยู่ในห้องนี้`, 'error');
                setBarcodeInput(''); return;
              }

              const timeString = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

              if (activeTab === 'attendance') {
                const key = `${code}_${currentSubjectId}`;
                const newAtt = { ...attendanceData, [key]: { status: 'present', time: timeString } };
                setAttendanceData(newAtt);
                syncRecords({ attendanceData: newAtt });
                showFeedback(student, 'บันทึกเข้าเรียนสำเร็จ ✨', 'success');
              } 
              else if (activeTab === 'behavior') {
                setBehaviorModal({ isOpen: true, student });
              }
              else if (activeTab === 'assignment') {
                const currentScores = {};
                filteredAssignments.forEach(a => {
                  currentScores[a.id] = assignmentData[a.id]?.[student.id] ? assignmentData[a.id][student.id].score : '';
                });
                setModalScores(currentScores);
                setGradingModal({ isOpen: true, student });
              }
            } else { showFeedback(null, `ไม่พบรหัส: ${code} 🚨`, 'error'); }
            setBarcodeInput('');
          };

          const handleAddBehavior = (points, reason) => {
             const key = `${behaviorModal.student.id}_${currentSubjectId}`;
             const newLog = { points, reason, time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) };
             const newBeh = { ...behaviorData, [key]: [...(behaviorData[key] || []), newLog] };
             setBehaviorData(newBeh);
             syncRecords({ behaviorData: newBeh });
             showFeedback(behaviorModal.student, `บันทึกจิตพิสัย: ${reason} (${points > 0 ? '+'+points : points})`, points > 0 ? 'success' : 'error');
             setBehaviorModal({ isOpen: false, student: null });
          };

          const getBehaviorScore = (studentId) => {
             const logs = behaviorData[`${studentId}_${currentSubjectId}`] || [];
             return logs.reduce((sum, log) => sum + log.points, 0); 
          };

          const handleSaveGrading = () => {
            const { student } = gradingModal;
            const timeString = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            
            const newData = { ...assignmentData };
            filteredAssignments.forEach(a => {
              const val = modalScores[a.id];
              if (val !== '' && val !== undefined) {
                if (!newData[a.id]) newData[a.id] = {};
                newData[a.id] = { ...newData[a.id], [student.id]: { status: 'submitted', time: timeString, score: parseFloat(val) } };
              }
            });
            setAssignmentData(newData);
            syncRecords({ assignmentData: newData });
            
            showFeedback(student, 'บันทึกคะแนนงานเรียบร้อย 🎯', 'success');
            setGradingModal({ isOpen: false, student: null });
          };

          const startRandomizer = () => {
             if(filteredStudents.length === 0) return alert('ไม่มีนักเรียนในห้องนี้');
             setRandomizerModal({ isOpen: true, result: filteredStudents[0], spinning: true });
             let ticks = 0;
             randomIntervalRef.current = setInterval(() => {
                 setRandomizerModal(prev => ({ ...prev, result: filteredStudents[Math.floor(Math.random() * filteredStudents.length)] }));
                 ticks++;
                 if(ticks > 25) { 
                     clearInterval(randomIntervalRef.current);
                     const winner = filteredStudents[Math.floor(Math.random() * filteredStudents.length)];
                     setRandomizerModal({ isOpen: true, result: winner, spinning: false });
                 }
             }, 80);
          };

          // Settings Management
          const resetForms = () => { setEditItem(null); setClassForm({ id: '', name: '' }); setSubjectForm({ id: '', name: '' }); setStudentForm({ id: '', number: '', name: '', classId: classes[0]?.id || '' }); setAssignForm({ id: '', title: '', maxScore: '', subjectId: subjects[0]?.id || '', classId: classes[0]?.id || '' }); setScheduleForm({ id: '', day: 'จันทร์', startTime: '', endTime: '', classId: classes[0]?.id || '', subjectId: subjects[0]?.id || '' }); };
          
          const handleSaveClass = (e) => { 
              e.preventDefault(); 
              let n;
              if (editItem) { n = classes.map(c => c.id === editItem.id ? { ...c, ...classForm } : c); } 
              else {
                  const maxNum = classes.reduce((max, c) => { const match = c.id.match(/\d+/); return match ? Math.max(max, parseInt(match[0], 10)) : max; }, 0);
                  const newId = "C" + String(maxNum + 1).padStart(2, '0');
                  n = [...classes, { ...classForm, id: newId }];
              }
              setClasses(n); syncCore({classes: n}); resetForms(); 
          };
          const handleDeleteClass = (id) => { const n = classes.filter(x=>x.id!==id); setClasses(n); syncCore({classes: n}); };
          
          const handleSaveSubject = (e) => { 
              e.preventDefault(); 
              let n;
              if (editItem) { n = subjects.map(s => s.id === editItem.id ? { ...s, ...subjectForm } : s); } 
              else {
                  const maxNum = subjects.reduce((max, s) => { const match = s.id.match(/\d+/); return match ? Math.max(max, parseInt(match[0], 10)) : max; }, 0);
                  const newId = "SUB" + String(maxNum + 1).padStart(2, '0');
                  n = [...subjects, { ...subjectForm, id: newId }];
              }
              setSubjects(n); syncCore({subjects: n}); resetForms(); 
          };
          const handleDeleteSubject = (id) => { const n = subjects.filter(x=>x.id!==id); setSubjects(n); syncCore({subjects: n}); };

          const handleSaveStudent = (e) => { 
              e.preventDefault(); 
              const n = editItem 
                  ? students.map(s => s.id === editItem.id ? { ...s, ...studentForm, image: s.image } : s) 
                  : [...students, { ...studentForm, id: studentForm.id.toUpperCase(), image: `https://api.dicebear.com/7.x/avataaars/svg?seed=${studentForm.id}&backgroundColor=b6e3f4` }]; 
              setStudents(n); syncCore({students: n}); resetForms(); 
          };
          const handleDeleteStudent = (id) => { const n = students.filter(x=>x.id!==id); setStudents(n); syncCore({students: n}); };

          const handleSaveAssign = (e) => { 
              e.preventDefault(); 
              let n;
              if (editItem) { n = assignments.map(a => a.id === editItem.id ? { ...a, ...assignForm, maxScore: Number(assignForm.maxScore) } : a); } 
              else {
                  const maxNum = assignments.reduce((max, a) => { const match = a.id.match(/\d+/); return match ? Math.max(max, parseInt(match[0], 10)) : max; }, 0);
                  const newId = "HW" + String(maxNum + 1).padStart(2, '0');
                  n = [...assignments, { ...assignForm, id: newId, maxScore: Number(assignForm.maxScore) }];
              }
              setAssignments(n); syncCore({assignments: n}); resetForms(); 
          };
          const handleDeleteAssign = (id) => { const n = assignments.filter(x=>x.id!==id); setAssignments(n); syncCore({assignments: n}); };

          const handleSaveSchedule = (e) => { 
              e.preventDefault(); 
              let n;
              if (editItem) { n = schedules.map(s => s.id === editItem.id ? { ...s, ...scheduleForm } : s); } 
              else {
                  const maxNum = schedules.reduce((max, s) => { const match = s.id.match(/\d+/); return match ? Math.max(max, parseInt(match[0], 10)) : max; }, 0);
                  const newId = "SCH" + String(maxNum + 1).padStart(2, '0');
                  n = [...schedules, { ...scheduleForm, id: newId }];
              }
              setSchedules(n); syncCore({schedules: n}); resetForms(); 
          };
          const handleDeleteSchedule = (id) => { const n = schedules.filter(x=>x.id!==id); setSchedules(n); syncCore({schedules: n}); };

          // --- การเก็บลง Google Sheets แบบไม่ต้องยิง API ให้รวน ---
          const exportToCSV = () => {
              let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
              let headerRow = ["เลขที่", "ชื่อ-นามสกุล", "เข้าเรียน", "จิตพิสัย"];
              filteredAssignments.forEach(a => headerRow.push(a.title + " (คะแนนเต็ม " + a.maxScore + ")"));
              headerRow.push("คะแนนรวม");
              
              csvContent += headerRow.join(",") + "\r\n";
              
              filteredStudents.sort((a,b) => a.number - b.number).forEach(s => {
                  let row = [];
                  row.push(s.number);
                  row.push(`"${s.name}"`); 
                  
                  const present = attendanceData[`${s.id}_${currentSubjectId}`]?.status === 'present' ? '1' : '0';
                  row.push(present);
                  
                  const behaviorPts = getBehaviorScore(s.id);
                  row.push(behaviorPts);
                  
                  let total = 0, max = 0;
                  filteredAssignments.forEach(a => {
                      const sc = assignmentData[a.id]?.[s.id]?.score;
                      total += (sc || 0); max += a.maxScore;
                      row.push(sc !== undefined ? sc : '0');
                  });
                  row.push(total);
                  
                  csvContent += row.join(",") + "\r\n";
              });
              
              const className = classes.find(c=>c.id===currentClassId)?.name || 'Class';
              const subjectName = subjects.find(s=>s.id===currentSubjectId)?.name || 'Subject';
              
              const encodedUri = encodeURI(csvContent);
              const link = document.createElement("a");
              link.setAttribute("href", encodedUri);
              link.setAttribute("download", `รายงาน_${className}_${subjectName}.csv`);
              document.body.appendChild(link); link.click(); document.body.removeChild(link);
          };

          if (userRole === 'guest') {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-float"></div>
                <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-float" style={{animationDelay: '1.5s'}}></div>

                <div className="max-w-md w-full glass-panel rounded-[2rem] shadow-2xl overflow-hidden relative z-10 animate-pop border border-white/20">
                  <div className="bg-gradient-to-br from-indigo-600 to-purple-700 p-10 text-center relative">
                    <div className="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-md shadow-lg"><i className="fas fa-rocket text-4xl text-white animate-float"></i></div>
                    <h1 className="text-3xl font-bold text-white tracking-wide">Smart Class Pro</h1>
                    <p className="text-indigo-100 mt-2 font-light">ยกระดับการสอนให้เป็นเรื่องง่าย 🚀</p>
                  </div>
                  
                  <div className="flex bg-white/50 border-b border-white/40">
                    <button onClick={() => setLoginTab('teacher')} className={`flex-1 py-4 font-semibold text-sm transition-all ${loginTab === 'teacher' ? 'text-indigo-700 bg-white shadow-sm border-b-2 border-indigo-600' : 'text-slate-500 hover:bg-white/40'}`}>👨‍🏫 ครูผู้สอน</button>
                    <button onClick={() => setLoginTab('student')} className={`flex-1 py-4 font-semibold text-sm transition-all ${loginTab === 'student' ? 'text-indigo-700 bg-white shadow-sm border-b-2 border-indigo-600' : 'text-slate-500 hover:bg-white/40'}`}>👨‍🎓 นักเรียน / ผู้ปกครอง</button>
                  </div>

                  <div className="p-8 bg-white/80">

                    <div className="bg-white rounded-[3rem] shadow-2xl w-full max-w-md p-10 text-center animate-pop relative overflow-hidden">
                       {!randomizerModal.spinning && (<div className="absolute inset-0 pointer-events-none opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCI+PGNpcmNsZSBjeD0iMjUiIGN5PSIyNSIgcj0iMiIgZmlsbD0iIzAwMCIvPjwvc3ZnPg==')]"></div>)}
                       <h3 className="text-2xl font-bold text-slate-800 mb-8">{randomizerModal.spinning ? '🎲 กำลังสุ่มนักเรียน...' : '🎉 ผู้โชคดีคือ!'}</h3>
                       {randomizerModal.result && (<div className={`transition-all duration-100 ${randomizerModal.spinning ? 'scale-95 opacity-80 blur-[1px]' : 'scale-110 opacity-100 animate-pop'}`}><img src={randomizerModal.result.image} className={`w-32 h-32 mx-auto rounded-full shadow-xl bg-slate-100 mb-6 border-4 ${randomizerModal.spinning ? 'border-slate-200' : 'border-amber-400'}`} /><div className="text-3xl font-bold text-indigo-700">{randomizerModal.result.name}</div><div className="text-slate-500 font-medium mt-2 bg-slate-100 inline-block px-4 py-1 rounded-full">เลขที่ {randomizerModal.result.number}</div></div>)}
                       <div className="mt-10 flex justify-center gap-3 relative z-10">{!randomizerModal.spinning && (<React.Fragment><button onClick={() => setRandomizerModal({isOpen:false})} className="px-6 py-3 bg-slate-100 text-slate-700 rounded-2xl font-bold hover:bg-slate-200">ปิดหน้าต่าง</button><button onClick={startRandomizer} className="px-8 py-3 bg-gradient-to-r from-amber-400 to-orange-500 text-white rounded-2xl font-bold hover:scale-105 shadow-lg">สุ่มอีกครั้ง 🎲</button></React.Fragment>)}</div>
                    </div>
                  </div>
                )}
                
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
