<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School OS: Unified Education Platform</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Charts -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'], display: ['Prompt', 'sans-serif'] },
                    colors: { 
                        primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
                        emerald: { 50:'#ecfdf5',100:'#d1fae5',500:'#10b981',600:'#059669',700:'#047857' },
                        rose: { 50:'#fff1f2',100:'#ffe4e6',500:'#f43f5e',600:'#e11d48',700:'#be123c' },
                        amber: { 50:'#fffbeb',100:'#fef3c7',500:'#f59e0b',600:'#d97706',700:'#b45309' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; color: #334155; -webkit-font-smoothing: antialiased; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid #f8fafc; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* UI Components */
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 40px -10px rgba(15, 23, 42, 0.08); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* Scanner Effects */
        @keyframes scan-active { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 30px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .is-scanning .scanner-ring { animation: scan-active 2s infinite; border-color: rgba(59, 130, 246, 0.6); }
        .scanner-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; border-radius: 50%; border: 3px solid transparent; pointer-events: none; transition: border-color 0.3s; }
        
        /* Grid Tables */
        .sticky-col { position: sticky; background-color: #ffffff; z-index: 40; } 
        .sticky-left-0 { left: 0; width: 50px; min-width: 50px; border-right: 1px solid #e2e8f0; }
        .sticky-left-1 { left: 50px; width: 90px; min-width: 90px; border-right: 1px solid #e2e8f0; }
        .sticky-left-2 { left: 140px; width: 200px; min-width: 200px; border-right: 1px solid #e2e8f0; box-shadow: 4px 0 6px -4px rgba(0,0,0,0.1); }
        thead { z-index: 50; position: sticky; top: 0; }
        thead th { background-color: #f8fafc; }
        thead .sticky-col { z-index: 60; background-color: #f8fafc; } 
        tr:nth-child(even) .sticky-col { background-color: #ffffff; }
        tr:nth-child(odd) .sticky-col { background-color: #f8fafc; } 
        tr:hover .sticky-col { background-color: #eff6ff; }
        .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; text-align: left; height: 130px; padding: 4px; display: flex; align-items: center; overflow: hidden; text-overflow: ellipsis; }

        @media print {
            body { background: white; margin: 0; overflow: visible; height: auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print, nav, aside, header, .toast-container, .virtual-numpad { display: none !important; }
            .print-only { display: block !important; width: 100%; font-family: 'Sarabun', sans-serif !important; color: #000; }
            #root, main, .overflow-y-auto, .overflow-auto { overflow: visible !important; height: auto !important; max-height: none !important; position: static !important; }
            table { width: 100%; border-collapse: collapse; page-break-inside: auto; table-layout: fixed; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            th, td { border: 1px solid #000 !important; padding: 6px 4px; text-align: center; font-size: 10pt; vertical-align: middle; word-wrap: break-word; }
            th { background-color: #e5e7eb !important; font-weight: bold; }
            td.text-left { text-align: left !important; padding-left: 8px !important; }
            @page { margin: 10mm; size: A4 landscape; } 
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, onSnapshot, writeBatch, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE SETUP ---
        const envConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        // ใช้ Demo Config หากไม่มีการตั้งค่า (ทำงานผ่าน Anonymous Auth)
        const firebaseConfig = envConfig || { 
            apiKey: "demo-api-key", authDomain: "demo.firebaseapp.com", projectId: "demo-project", appId: "1:demo:web:demo" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-os-enterprise-v1'; 

        const DEFAULT_MASTER = { 
            school: 'โรงเรียนเตรียมอุดมศึกษานวัตกรรม', 
            adminPassword: 'admin', 
            currentTerm: '1',
            currentYear: '2568',
            teachers: [
                { id: 't1', name: 'อ.สมศรี ใจดี', pin: '1234', homeroom: 'ม.4/1' }, 
                { id: 't2', name: 'อ.วิชาญ เก่งการ', pin: '5678', homeroom: 'ม.4/2' }
            ], 
            courses: [
                { id: 'c1', code: 'ว30242', name: 'ฟิสิกส์ประยุกต์', semester: '1', year: '2568', teacherId: 't1' }, 
                { id: 'c2', code: 'ค31101', name: 'คณิตศาสตร์เพิ่มเติม', semester: '1', year: '2568', teacherId: 't2' }
            ] 
        };
        const DEFAULT_GRADING = { '4': 80, '3.5': 75, '3': 70, '2.5': 65, '2': 60, '1.5': 55, '1': 50 };
        const SECTION_COLORS = [
            { bg: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-200' }, 
            { bg: 'bg-rose-100', text: 'text-rose-800', border: 'border-rose-200' }, 
            { bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-200' }, 
            { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-200' }
        ];

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'success') { 
                    osc.type='sine'; osc.frequency.setValueAtTime(1046.50, ctx.currentTime); // C6
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.15); 
                    osc.start(); osc.stop(ctx.currentTime+0.15); 
                }
                else if (type === 'error') { 
                    osc.type='sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.4); 
                    osc.start(); osc.stop(ctx.currentTime+0.4); 
                }
                else if (type === 'streak') { 
                    osc.type='square'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.setValueAtTime(1046.50, ctx.currentTime+0.1); 
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3); 
                    osc.start(); osc.stop(ctx.currentTime+0.3); 
                }
            } catch(e) { console.warn("Audio not supported"); }
        };

        const Icon = ({ name, size=20, className="", onClick, title }) => (
            <i onClick={onClick} title={title} className={`ph ph-${name} ${className}`} style={{ fontSize: size, cursor: onClick?'pointer':'inherit' }}></i>
        );

        const calculateAutoScore = (s, g, c) => {
            if (!g.columns) return '-'; 
            let total = 0, max = 0;
            g.columns.filter(cl => (cl.type === 'manual' || cl.type === 'check') && cl.published !== false).forEach(cl => {
                let v = s.scores?.[cl.id]; 
                let pVal = cl.type === 'check' ? (v ? parseFloat(cl.max || 0) : 0) : parseFloat(v || 0);
                total += pVal; max += parseFloat(cl.max || 0);
            });
            if (c.type === 'sum') return Math.ceil(total);
            if (c.type === 'percent') return max === 0 ? 0 : Math.ceil((total / max) * (c.max || 100));
            return '-';
        };

        const calculateTotalScoreCustom = (student, sectionsArray) => {
            let totalPercent = 0, hasPercent = false, totalManual = 0;
            (sectionsArray || []).forEach(s => {
                if (s.published === false) return;
                s.groups?.forEach(g => {
                    if (g.published === false) return;
                    g.columns?.forEach(c => {
                        if (c.published === false) return;
                        if (c.type === 'percent') {
                            let total = 0, max = 0;
                            g.columns.filter(cl => (cl.type === 'manual' || cl.type === 'check')).forEach(cl => {
                                let v = student.scores?.[cl.id]; 
                                let pVal = cl.type === 'check' ? (v ? parseFloat(cl.max || 0) : 0) : parseFloat(v || 0);
                                total += pVal; max += parseFloat(cl.max || 0);
                            });
                            let val = max === 0 ? 0 : Math.ceil((total / max) * (c.max || 100));
                            totalPercent += parseFloat(val); hasPercent = true;
                        } else if (c.type === 'manual') { 
                            totalManual += parseFloat(student.scores?.[c.id] || 0);
                        } else if (c.type === 'check') { 
                            totalManual += student.scores?.[c.id] ? parseFloat(c.max || 0) : 0; 
                        }
                    });
                });
            });
            return Math.ceil(hasPercent ? totalPercent : totalManual) || 0;
        };

        const calculateTotalMaxScore = (sectionsArray) => {
            let totalPercent = 0, hasPercent = false, totalManual = 0;
            sectionsArray.forEach(s => {
                if (s.published === false) return;
                s.groups?.forEach(g => {
                    if (g.published === false) return;
                    g.columns?.forEach(c => {
                        if (c.published === false) return;
                        if (c.type === 'percent') { totalPercent += parseFloat(c.max || 100); hasPercent = true; } 
                        else if (c.type === 'manual' || c.type === 'check') { totalManual += parseFloat(c.max || 0); }
                    });
                });
            });
            return Math.ceil(hasPercent ? totalPercent : totalManual) || 100;
        };

        const calculateGradeCustom = (score, grading) => {
            const g = grading || DEFAULT_GRADING;
            if(score >= g['4']) return 4; if(score >= g['3.5']) return 3.5; if(score >= g['3']) return 3; if(score >= g['2.5']) return 2.5;
            if(score >= g['2']) return 2; if(score >= g['1.5']) return 1.5; if(score >= g['1']) return 1; return 0;
        };

        function Modal({ isOpen, title, children, onClose }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl w-full max-w-lg animate-pop overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 className="font-bold text-lg font-display text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:bg-slate-200 hover:text-rose-500 p-1.5 rounded-full transition-colors"><Icon name="x" size={18}/></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">{children}</div>
                    </div>
                </div>
            );
        }

        function VirtualNumpad({ isOpen, onInput, onClose }) {
            const { useState, useRef, useEffect } = React;
            if (!isOpen) return null;
            const [pos, setPos] = useState({ x: window.innerWidth - 300, y: window.innerHeight / 2 - 150 });
            const [dragging, setDragging] = useState(false);
            const offset = useRef({ x: 0, y: 0 });

            useEffect(() => {
                const move = (e) => { if (dragging) setPos({ x: e.clientX - offset.current.x, y: e.clientY - offset.current.y }); };
                const up = () => setDragging(false);
                window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
                return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
            }, [dragging]);

            return (
                <div className="fixed z-[150] bg-white rounded-2xl shadow-2xl border border-slate-200 w-64 overflow-hidden animate-pop virtual-numpad" style={{ left: pos.x, top: pos.y }}>
                    <div className="bg-slate-800 text-white p-2 cursor-move flex justify-between items-center select-none" onMouseDown={e => { setDragging(true); offset.current = { x: e.clientX - pos.x, y: e.clientY - pos.y }; }}>
                        <span className="text-xs font-bold uppercase tracking-wide flex items-center gap-1.5 pl-1"><Icon name="calculator" size={14}/> Keypad</span>
                        <button onClick={onClose} className="text-slate-400 hover:text-white p-1"><Icon name="x" size={14}/></button>
                    </div>
                    <div className="grid grid-cols-3 gap-2 p-3 bg-slate-50">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9, '.', 0].map(k => (
                            <button key={k} onClick={() => onInput(k)} className="h-12 bg-white rounded-xl shadow-sm border border-slate-200 font-display font-bold text-xl text-slate-700 active:scale-95 transition hover:bg-primary-50 hover:border-primary-300 hover:text-primary-700">{k}</button>
                        ))}
                        <button onClick={() => onInput('Del')} className="h-12 bg-rose-50 rounded-xl shadow-sm border border-rose-200 font-bold text-rose-500 active:scale-95 transition flex items-center justify-center hover:bg-rose-100"><Icon name="backspace" size={24}/></button>
                    </div>
                </div>
            );
        }

        function App() {
            const { useState, useEffect, useRef, useMemo } = React;
            
            // System States
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [modal, setModal] = useState(null);

            // Core Data States
            const [view, setView] = useState('portal'); // portal, login, admin, teacher_home, course_detail, homeroom_detail
            const [loggedUser, setLoggedUser] = useState(null);
            const [masterData, setMasterData] = useState(DEFAULT_MASTER);
            
            // Admin Panel States
            const [adminTab, setAdminTab] = useState('general'); // general, personnel, academic
            
            // Login States
            const [loginTab, setLoginTab] = useState('teacher');
            const [loginId, setLoginId] = useState('');
            const [loginPin, setLoginPin] = useState('');
            const [adminPwd, setAdminPwd] = useState('');

            // Course Workspace States
            const [activeCourseId, setActiveCourseId] = useState(null);
            const [courseTab, setCourseTab] = useState('dashboard'); // dashboard, scan, sheet, scores, settings
            const [students, setStudents] = useState([]);
            const [sections, setSections] = useState([]);
            const [courseConfig, setCourseConfig] = useState({ grading: DEFAULT_GRADING, showGrade: false });
            const [logs, setLogs] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            
            // Interactive UI States
            const [barcode, setBarcode] = useState('');
            const [isFocused, setIsFocused] = useState(true);
            const [lastScan, setLastScan] = useState(null);
            const [numpadOpen, setNumpadOpen] = useState(false);
            
            const today = new Date();
            const [selectedMonth, setSelectedMonth] = useState(today.getMonth());
            const [selectedYear, setSelectedYear] = useState(today.getFullYear());
            
            // Refs
            const inputRef = useRef(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Parent Portal States
            const [parentSearchId, setParentSearchId] = useState('');
            const [parentResult, setParentResult] = useState(null);
            const [isSearchingParent, setIsSearchingParent] = useState(false);

            const showToast = (msg, type='success') => { 
                setToast({ msg, type }); 
                setTimeout(() => setToast(null), 3500); 
            };

            // Firebase Authentication & Master Data Listener
            useEffect(() => {
                const initAuth = async () => { 
                    try { 
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token); 
                        else await signInAnonymously(auth); 
                    } catch(e) { console.error("Auth Error", e); } 
                };
                initAuth();
                return onAuthStateChanged(auth, u => { setUser(u); if(!u) setLoading(false); });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubMaster = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'master', 'info'), (d) => {
                    if (d.exists()) { 
                        setMasterData(d.data()); 
                        setLoading(false); 
                    } else { 
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'master', 'info'), DEFAULT_MASTER); 
                    }
                });
                return unsubMaster;
            }, [user]);

            // Active Course Data Listener
            useEffect(() => {
                if (!user || !activeCourseId || view !== 'course_detail') return;
                
                const unsubConfig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', `config_${activeCourseId}`, 'main'), (d) => {
                    if (d.exists()) { 
                        const data = d.data(); 
                        setSections(data.sections || []); 
                        setCourseConfig({ grading: data.grading || DEFAULT_GRADING, showGrade: data.showGrade || false }); 
                    }
                    else { 
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', `config_${activeCourseId}`, 'main'), { sections: [], grading: DEFAULT_GRADING, showGrade: false }); 
                    }
                });
                
                const unsubStudents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `students_${activeCourseId}`), (snap) => {
                    const list = []; snap.forEach(doc => list.push({ id: doc.id, ...doc.data() })); 
                    setStudents(list.sort((a,b) => (parseInt(a.no)||0) - (parseInt(b.no)||0)));
                });

                const unsubLogs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', `logs_${activeCourseId}`), (snap) => {
                    const l = []; snap.forEach(doc => l.push({ docId: doc.id, ...doc.data() })); 
                    setLogs(l.sort((a,b) => b.rawTime - a.rawTime));
                });

                return () => { unsubConfig(); unsubStudents(); unsubLogs(); };
            }, [user, activeCourseId, view]);

            // Auto-focus for Kiosk Scanner
            useEffect(() => {
                let interval; 
                if (view === 'course_detail' && courseTab === 'scan') { 
                    interval = setInterval(() => { 
                        if (document.activeElement !== inputRef.current && inputRef.current) inputRef.current.focus(); 
                    }, 500); 
                }
                return () => clearInterval(interval);
            }, [view, courseTab]);

            // Chart.js rendering
            useEffect(() => {
                if (view === 'course_detail' && courseTab === 'dashboard' && chartRef.current && students.length > 0) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    const tStr = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                    
                    const present = students.filter(s => s.attendance?.[tStr] === 'success').length;
                    const leave = students.filter(s => s.attendance?.[tStr] === 'leave').length;
                    const absent = students.length - present - leave;

                    chartInstance.current = new Chart(ctx, { 
                        type: 'doughnut', 
                        data: { 
                            labels: ['มาเรียน', 'ลา', 'ขาดเรียน'], 
                            datasets: [{ 
                                data: [present, leave, absent], 
                                backgroundColor: ['#10b981', '#3b82f6', '#f43f5e'], 
                                borderWidth: 2,
                                borderColor: '#ffffff'
                            }] 
                        }, 
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { legend: { position: 'bottom', labels: { font: { family: 'Prompt' }, padding: 20 } } }, 
                            cutout: '70%',
                            animation: { animateScale: true, animateRotate: true }
                        } 
                    });
                }
            }, [view, courseTab, students, selectedMonth, selectedYear]);

            // Data Handlers
            const saveMasterData = async (newData) => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'master', 'info'), newData, { merge: true }); };
            const updateStudent = async (id, data) => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `students_${activeCourseId}`, id), data, { merge: true }); };
            const saveCourseConfigData = async (newSecs, newGrading, newShowGrade) => {
                const payload = {}; 
                if(newSecs !== null) payload.sections = newSecs; 
                if(newGrading !== null) payload.grading = newGrading; 
                if(newShowGrade !== null) payload.showGrade = newShowGrade;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', `config_${activeCourseId}`, 'main'), payload, { merge: true });
            };

            const handleScanBarcode = () => {
                const code = barcode.trim(); if (!code) return;
                const student = students.find(s => s.id === code);
                const t = new Date(); const tStr = t.toLocaleTimeString('th-TH');
                
                const isSpam = logs.find(l => l.student?.id === code && (t.getTime() - l.rawTime) < 60000 && l.status === 'success');
                if (isSpam) { playSound('error'); showToast(`สแกนซ้ำ: ${student.name}`, 'error'); setBarcode(''); return; }

                    addDoc(collection(db, 'artifacts', appId, 'public', 'data', `logs_${activeCourseId}`), { rawTime: t.getTime(), time: tStr, student: { id: student.id, name: student.name, room: student.room, no: student.no }, status: 'success' });
                    updateStudent(student.id, { streak: newStreak, [`attendance.${dStr}`]: 'success' });
                    setLastScan({ status: 'success', student: { ...student, streak: newStreak }, time: tStr });

                    if (!line || line.includes('รหัส') || line.includes('ชื่อ')) continue; // Skip header
                    const p = line.split(',');
                    if (p.length >= 4) {
                        const id = p[0].trim().replace(/['"]/g,''); const name = p[1].trim().replace(/['"]/g,''); 
                        const room = p[2].trim().replace(/['"]/g,''); const no = parseInt(p[3].trim().replace(/['"]/g,'')) || 0;
                        if (id && name) { 
                            batch.set(doc(db, 'artifacts', appId, 'public', 'data', `students_${targetCourseId}`, id), { id, name, room, no, scores: {}, attendance: {}, streak: 0 }, { merge: true });

                                    ))}
                                </div>
                                <p className="text-xs text-slate-400 mt-4 text-center">หากคะแนนรวมต่ำกว่าเกณฑ์ของเกรด 1 ระบบจะประมวลผลเป็นเกรด 0 อัตโนมัติ</p>
                            </div>

                            <div className="lg:col-span-1 glass-card p-8 md:p-10 rounded-[2.5rem] bg-white shadow-lg flex flex-col justify-center">
                                <div className="text-center mb-6">
                                    <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 text-3xl shadow-inner transition-colors ${courseConfig.showGrade ? 'bg-emerald-100 text-emerald-500' : 'bg-slate-100 text-slate-400'}`}>
                                        <Icon name={courseConfig.showGrade ? "megaphone" : "lock-key"} weight="fill"/>
                                    </div>
                                    <h4 className="font-bold text-slate-800 text-xl font-display mb-2">ประกาศผลการเรียน</h4>
                                    <p className="text-sm text-slate-500">เปิดให้นักเรียนและผู้ปกครองเห็นเกรดที่คำนวณได้ผ่านทาง Parent Portal</p>
                                </div>
                                <button onClick={() => { const v = !courseConfig.showGrade; setCourseConfig({...courseConfig, showGrade: v}); saveCourseConfigData(null, null, v); showToast(v?'ประกาศผลการเรียนแล้ว นักเรียนสามารถดูได้ทันที':'ซ่อนผลการเรียนจากระบบสาธารณะแล้ว', v?'success':'warning'); }} className={`w-full py-4 rounded-2xl font-bold text-lg shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 ${courseConfig.showGrade ? 'bg-rose-500 hover:bg-rose-600 text-white shadow-rose-500/30' : 'bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-500/30'}`}>
                                    {courseConfig.showGrade ? <><Icon name="x-circle" weight="bold"/> ซ่อนผลการเรียน</> : <><Icon name="check-circle" weight="bold"/> ประกาศผลให้สาธารณะเห็น</>}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // Main Layout Router
            return (
                <div className="flex h-screen overflow-hidden bg-slate-50 font-sans selection:bg-primary-200 selection:text-primary-900">
                    {toast && (
                        <div className="fixed bottom-8 right-8 z-[100] animate-slide-up">
                            <div className={`glass-card px-6 py-4 rounded-2xl shadow-2xl border flex items-center gap-4 border-white/50 ${toast.type === 'success' ? 'bg-white' : toast.type === 'error' ? 'bg-rose-50' : 'bg-amber-50'}`}>
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white shadow-inner ${toast.type === 'success' ? 'bg-gradient-to-br from-emerald-400 to-green-500' : toast.type === 'error' ? 'bg-gradient-to-br from-rose-400 to-red-500' : 'bg-gradient-to-br from-amber-400 to-orange-500'}`}><Icon name={toast.type==='success'?'check':toast.type==='error'?'x':'warning'} size={20} weight="bold"/></div>
                                <div>
                                    <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">System Alert</div>
                                    <div className={`font-bold text-sm ${toast.type === 'success' ? 'text-slate-700' : toast.type === 'error' ? 'text-rose-700' : 'text-amber-700'}`}>{toast.msg}</div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <Modal isOpen={modal?.type==='import'} title="นำเข้าข้อมูลนักเรียน (CSV Import)" onClose={()=>setModal(null)}>
                        <div className="space-y-6">
                            <div className="bg-primary-50 border border-primary-200 text-primary-800 text-sm p-4 rounded-2xl flex items-start gap-3">
                                <Icon name="info" size={24} className="mt-0.5 text-primary-500 shrink-0" weight="fill"/>
                                <div><strong>ฟอร์แมตที่ระบบรองรับ:</strong> คอลัมน์ที่ 1: รหัส, คอลัมน์ที่ 2: ชื่อ-สกุล, คอลัมน์ที่ 3: ห้อง (เช่น 1/1), คอลัมน์ที่ 4: เลขที่ (ส่วนหัวข้อคอลัมน์ระบบจะข้ามให้อัตโนมัติ)</div>
                            </div>
                            <textarea className="w-full h-48 border border-slate-200 rounded-2xl p-4 text-sm font-mono bg-slate-50 outline-none focus:ring-4 focus:ring-primary-50 focus:border-primary-400 transition-shadow resize-none" placeholder="วางข้อมูลที่คัดลอกจาก Excel ลงที่นี่...&#10;1001,ด.ช.สมชาย ใจดี,1/1,1&#10;1002,ด.ญ.สมหญิง รักเรียน,1/1,2" id="importText"></textarea>
                            <button onClick={()=>handleBatchImport(document.getElementById('importText').value, modal.targetId || activeCourseId)} className="w-full py-4 bg-slate-800 text-white font-bold rounded-2xl shadow-xl shadow-slate-200 hover:bg-slate-900 transition-all active:scale-95 flex items-center justify-center gap-2">
                                <Icon name="cloud-arrow-up" size={20} weight="bold"/> ยืนยันการนำเข้าและซิงค์ขึ้น Cloud
                            </button>
                        </div>
                    </Modal>

                    {view !== 'portal' && view !== 'login' && renderSidebar()}

                    <main className="flex-1 flex flex-col overflow-hidden relative z-0 no-print">
                        <div className="flex-1 overflow-y-auto bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-slate-50/50 relative">
                            {view === 'portal' && renderParentPortal()}
                            {view === 'login' && renderLogin()}
                            {view === 'teacher_home' && renderTeacherHome()}
                            {view === 'homeroom_detail' && renderHomeroomDetail()}
                            {view === 'admin' && renderAdminDashboard()}
                            {view === 'course_detail' && renderCourseWorkspace()}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
