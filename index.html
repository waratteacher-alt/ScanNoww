<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classroom Simulator Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (สำหรับคอมไพล์ JSX ในเบราว์เซอร์) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* ซ่อน Scrollbar สำหรับ Sidebar แต่ยัง Scroll ได้ */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const INITIAL_CLASSES = [
          { id: 'C01', name: 'ม.1/1' },
          { id: 'C02', name: 'ม.1/2' }
        ];

        const INITIAL_SUBJECTS = [
          { id: 'SUB01', name: 'คณิตศาสตร์พื้นฐาน' },
          { id: 'SUB02', name: 'วิทยาศาสตร์' }
        ];

        const INITIAL_STUDENTS = [
          { id: 'STD001', number: 1, classId: 'C01', name: 'ด.ช. สมชาย รักเรียน', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Somchai&backgroundColor=b6e3f4' },
          { id: 'STD002', number: 2, classId: 'C01', name: 'ด.ญ. สมหญิง ขยันยิ่ง', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Somying&backgroundColor=c0aede' },
          { id: 'STD003', number: 3, classId: 'C01', name: 'ด.ช. มานะ อดทน', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Mana&backgroundColor=ffdfbf' },
          { id: 'STD004', number: 1, classId: 'C02', name: 'ด.ญ. ปิติ ดีใจ', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Piti&backgroundColor=d1d4f9' },
          { id: 'STD005', number: 2, classId: 'C02', name: 'ด.ช. ชูใจ ไชโย', image: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Chujai&backgroundColor=c0aede' },
        ];

        const INITIAL_ASSIGNMENTS = [
          { id: 'HW01', subjectId: 'SUB01', title: 'แบบฝึกหัดคณิตศาสตร์ บทที่ 1', maxScore: 10 },
          { id: 'HW02', subjectId: 'SUB02', title: 'รายงานวิทยาศาสตร์ เรื่อง พืช', maxScore: 20 },
          { id: 'HW03', subjectId: 'SUB01', title: 'สอบย่อย ภาษาอังกฤษ', maxScore: 15 },
        ];

        function App() {
          // Auth State
          const [userRole, setUserRole] = useState('guest'); 
          const [currentUser, setCurrentUser] = useState(null);
          
          // Login State
          const [loginTab, setLoginTab] = useState('teacher');
          const [loginForm, setLoginForm] = useState({ username: '', password: '', studentId: '' });
          const [loginError, setLoginError] = useState('');

          // Main Data States
          const [activeTab, setActiveTab] = useState('attendance');
          const [classes, setClasses] = useState(INITIAL_CLASSES);
          const [subjects, setSubjects] = useState(INITIAL_SUBJECTS);
          const [students, setStudents] = useState(INITIAL_STUDENTS);
          const [assignments, setAssignments] = useState(INITIAL_ASSIGNMENTS);
          
          // Current Context Filters
          const [currentClassId, setCurrentClassId] = useState(INITIAL_CLASSES[0]?.id || '');
          const [currentSubjectId, setCurrentSubjectId] = useState(INITIAL_SUBJECTS[0]?.id || '');

          // Records
          const [attendanceData, setAttendanceData] = useState({});
          const [assignmentData, setAssignmentData] = useState({});
          
          // Scanner & Modals
          const [barcodeInput, setBarcodeInput] = useState('');
          const [lastScanned, setLastScanned] = useState(null);
          const [comprehensiveModal, setComprehensiveModal] = useState({ isOpen: false, student: null });
          const [modalScores, setModalScores] = useState({});

          const scannerInputRef = useRef(null);

          // Manage focus for scanner input
          useEffect(() => {
            if (userRole === 'teacher' && (activeTab === 'attendance' || activeTab === 'assignment') && !comprehensiveModal.isOpen) {
              if (scannerInputRef.current) scannerInputRef.current.focus();
            }
          }, [activeTab, userRole, comprehensiveModal.isOpen, currentClassId, currentSubjectId]);

          // Filter data based on selected class/subject
          const filteredStudents = students.filter(s => s.classId === currentClassId);
          const filteredAssignments = assignments.filter(a => a.subjectId === currentSubjectId);

          const handleLogin = (e) => {
            e.preventDefault();
            if (loginTab === 'teacher') {
              if (loginForm.username === 'admin' && loginForm.password === 'password') {
                setUserRole('teacher');
                setLoginError('');
              } else {
                setLoginError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (ลอง admin / password)');
              }
            } else {
              const student = students.find(s => s.id === loginForm.studentId.toUpperCase());
              if (student) {
                setUserRole('student');
                setCurrentUser(student);
                setLoginError('');
              } else {
                setLoginError('ไม่พบรหัสนักเรียนนี้ในระบบ');
              }
            }
          };

          const handleLogout = () => {
            setUserRole('guest');
            setCurrentUser(null);
            setLoginForm({ username: '', password: '', studentId: '' });
          };

          const handleScanSubmit = (e) => {
            e.preventDefault();
            const code = barcodeInput.trim().toUpperCase();
            if (!code) return;

            // Check if student belongs to the currently selected class
            const student = students.find(s => s.id === code);

            if (student) {
              if (student.classId !== currentClassId) {
                showFeedback(null, `นักเรียนไม่ได้อยู่ห้องเรียนที่เลือก (${classes.find(c=>c.id === currentClassId)?.name})`, 'error');
                setBarcodeInput('');
                return;
              }

              const now = new Date();
              const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

              if (activeTab === 'attendance') {
                setAttendanceData(prev => ({
                  ...prev,
                  [code]: { status: 'present', time: timeString }
                }));
                showFeedback(student, 'เช็คชื่อเข้าเรียนสำเร็จ', 'success');
                setBarcodeInput('');
              } 
              else if (activeTab === 'assignment') {
                const currentScores = {};
                filteredAssignments.forEach(a => {
                  if (assignmentData[a.id]?.[student.id]) {
                    currentScores[a.id] = assignmentData[a.id][student.id].score;
                  } else {
                    currentScores[a.id] = '';
                  }
                });
                
                setModalScores(currentScores);
                setComprehensiveModal({ isOpen: true, student: student });
                setBarcodeInput('');
              }
            } else {
              showFeedback(null, `ไม่พบข้อมูลรหัส: ${code}`, 'error');
              setBarcodeInput('');
            }
          };

          const handleSaveAllScores = () => {
            const { student } = comprehensiveModal;
            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            setAssignmentData(prev => {
              const newData = { ...prev };
              filteredAssignments.forEach(a => {
                const scoreVal = modalScores[a.id];
                if (scoreVal !== '' && scoreVal !== undefined) {
                  if (!newData[a.id]) newData[a.id] = {};
                  newData[a.id] = {
                    ...newData[a.id],
                    [student.id]: { status: 'submitted', time: timeString, score: parseFloat(scoreVal) }
                  };
                }
              });
              return newData;
            });

            showFeedback(student, 'อัปเดตข้อมูลและคะแนนงานเรียบร้อย', 'success');
            setComprehensiveModal({ isOpen: false, student: null });
          };

          const showFeedback = (student, message, type) => {
            setLastScanned({ student, message, type });
            setTimeout(() => setLastScanned(null), 3000);
          };

          if (userRole === 'guest') {
            return (
              <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 font-sans">
                <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
                  <div className="bg-blue-600 p-8 text-center relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-4 opacity-10"><i className="fas fa-graduation-cap text-9xl"></i></div>
                    <i className="fas fa-barcode text-6xl text-white mx-auto mb-4 relative z-10 block text-center"></i>
                    <h1 className="text-3xl font-bold text-white relative z-10">Smart Class Pro</h1>
                    <p className="text-blue-100 mt-2 relative z-10">ระบบจัดการชั้นเรียนและติดตามผู้เรียน</p>
                  </div>
                  
                  <div className="flex border-b">
                    <button onClick={() => setLoginTab('teacher')} className={`flex-1 py-4 font-semibold text-sm flex justify-center items-center gap-2 ${loginTab === 'teacher' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>
                      <i className="fas fa-lock text-base"></i> สำหรับครูผู้สอน
                    </button>
                    <button onClick={() => setLoginTab('student')} className={`flex-1 py-4 font-semibold text-sm flex justify-center items-center gap-2 ${loginTab === 'student' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>
                      <i className="fas fa-users text-base"></i> สำหรับนักเรียน/ผู้ปกครอง
                    </button>
                  </div>

                  <div className="p-8">
                    {loginError && <div className="mb-6 p-3 bg-red-50 text-red-600 rounded-lg text-sm text-center border border-red-200 flex items-center justify-center gap-2"><i className="fas fa-exclamation-triangle"></i> {loginError}</div>}
                    <form onSubmit={handleLogin} className="space-y-4">
                      {loginTab === 'teacher' ? (
                        <React.Fragment>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้ (Username)</label>
                            <input type="text" className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" value={loginForm.username} onChange={(e) => setLoginForm({...loginForm, username: e.target.value})} placeholder="พิมพ์ admin" />
                          </div>
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                            <input type="password" className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" value={loginForm.password} onChange={(e) => setLoginForm({...loginForm, password: e.target.value})} placeholder="พิมพ์ password" />
                          </div>
                        </React.Fragment>
                      ) : (
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">รหัสนักเรียน (Student ID)</label>
                          <input type="text" className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase" value={loginForm.studentId} onChange={(e) => setLoginForm({...loginForm, studentId: e.target.value})} placeholder="เช่น STD001" />
                          <p className="text-xs text-gray-500 mt-2 text-center">ใช้รหัสนักเรียนเพื่อเข้าดูคะแนนและการเข้าเรียน</p>
                        </div>
                      )}
                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-colors mt-4 shadow-lg shadow-blue-200">เข้าสู่ระบบ</button>
                    </form>
                  </div>
                </div>
              </div>
            );
          }

          if (userRole === 'student' && currentUser) {
            const isPresent = attendanceData[currentUser.id]?.status === 'present';
            const presentTime = attendanceData[currentUser.id]?.time;
            
            let totalScore = 0; let maxTotal = 0; let missingCount = 0;
            
            assignments.forEach(a => {
              maxTotal += a.maxScore;
              const record = assignmentData[a.id]?.[currentUser.id];
              if (record) totalScore += record.score;
              else missingCount++;
            });

            const studentClass = classes.find(c => c.id === currentUser.classId)?.name || 'ไม่ระบุ';

            return (
              <div className="min-h-screen bg-gray-50 font-sans pb-10">
                <div className="bg-blue-600 text-white p-6 shadow-md">
                  <div className="max-w-4xl mx-auto flex justify-between items-center">
                    <h1 className="text-xl font-bold flex items-center gap-2"><i className="fas fa-graduation-cap"></i> ระบบติดตามผู้เรียน</h1>
                    <button onClick={handleLogout} className="flex items-center gap-2 bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded-lg transition-colors text-sm">
                      <i className="fas fa-sign-out-alt"></i> ออกจากระบบ
                    </button>
                  </div>
                </div>

                <div className="max-w-4xl mx-auto px-4 mt-8 space-y-6">
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col md:flex-row items-center gap-6">
                    <img src={currentUser.image} alt="Profile" className="w-24 h-24 rounded-full bg-blue-50 border-4 border-white shadow-md" />
                    <div className="text-center md:text-left">
                      <h2 className="text-2xl font-bold text-gray-800">{currentUser.name}</h2>
                      <p className="text-gray-500 mt-1">ห้อง: {studentClass} | เลขที่: {currentUser.number} | รหัส: {currentUser.id}</p>
                      <div className="mt-3 inline-flex items-center gap-2 px-3 py-1 bg-gray-50 border rounded-full text-sm">
                        <span className="text-gray-600">สถานะวันนี้:</span>
                        {isPresent 
                          ? <span className="text-green-600 font-bold flex items-center gap-1"><i className="fas fa-check-circle"></i> มาเรียน ({presentTime})</span>
                          : <span className="text-red-500 font-bold flex items-center gap-1"><i className="fas fa-clock"></i> ยังไม่เช็คชื่อ</span>
                        }
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-center">
                      <div className="w-12 h-12 mx-auto bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-3"><i className="fas fa-bookmark text-xl"></i></div>
                      <p className="text-gray-500 text-sm">งานทั้งหมด</p>
                      <p className="text-2xl font-bold text-gray-800">{assignments.length}</p>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-center">
                      <div className="w-12 h-12 mx-auto bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-3"><i className="fas fa-check-circle text-xl"></i></div>
                      <p className="text-gray-500 text-sm">คะแนนสะสม</p>
                      <p className="text-2xl font-bold text-green-600">{totalScore} <span className="text-sm text-gray-400">/ {maxTotal}</span></p>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-center">
                      <div className="w-12 h-12 mx-auto bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-3"><i className="fas fa-exclamation-triangle text-xl"></i></div>
                      <p className="text-gray-500 text-sm">งานค้างส่ง</p>
                      <p className="text-2xl font-bold text-red-600">{missingCount}</p>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className="p-5 border-b border-gray-100 bg-gray-50/50">
                      <h3 className="font-bold text-lg text-gray-800">รายละเอียดการส่งงาน</h3>
                    </div>
                    <div className="divide-y divide-gray-100">
                      {assignments.map(a => {
                        const record = assignmentData[a.id]?.[currentUser.id];
                        const subjectName = subjects.find(sub => sub.id === a.subjectId)?.name || 'ไม่ระบุวิชา';
                        return (
                          <div key={a.id} className="p-5 flex flex-col md:flex-row md:items-center justify-between hover:bg-gray-50 transition-colors gap-4">
                            <div>
                              <h4 className="font-semibold text-gray-800">{a.title}</h4>
                              <p className="text-sm text-gray-500 mt-1">วิชา: <span className="text-blue-600">{subjectName}</span> | รหัสงาน: {a.id}</p>
                            </div>
                            <div className="text-left md:text-right">
                              {record ? (
                                <div className="bg-green-50 border border-green-200 px-4 py-2 rounded-lg inline-block md:block">
                                  <p className="text-xs text-green-600 mb-1 font-semibold">ส่งแล้ว</p>
                                  <p className="font-bold text-green-700 text-lg">{record.score} <span className="text-sm text-green-600/70">/ {a.maxScore}</span></p>
                                </div>
                              ) : (
                                <div className="bg-red-50 border border-red-200 px-4 py-2 rounded-lg inline-block md:block">
                                  <p className="text-xs text-red-600 mb-1 font-semibold">ยังไม่ส่งงาน</p>
                                  <p className="font-bold text-red-700">รอตรวจ</p>
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          const SettingsTab = () => {
            const [settingsMenu, setSettingsMenu] = useState('overview'); // overview, classes, subjects, students, assignments
            const [editItem, setEditItem] = useState(null);
            
            // Forms
            const [classForm, setClassForm] = useState({ id: '', name: '' });
            const [subjectForm, setSubjectForm] = useState({ id: '', name: '' });
            const [studentForm, setStudentForm] = useState({ id: '', number: '', name: '', classId: classes[0]?.id || '' });
            const [assignForm, setAssignForm] = useState({ id: '', title: '', maxScore: '', subjectId: subjects[0]?.id || '' });

            const resetForms = () => { setEditItem(null); setClassForm({ id: '', name: '' }); setSubjectForm({ id: '', name: '' }); setStudentForm({ id: '', number: '', name: '', classId: classes[0]?.id || '' }); setAssignForm({ id: '', title: '', maxScore: '', subjectId: subjects[0]?.id || '' }); };

            const handleSaveClass = (e) => {
              e.preventDefault();
              if(editItem) setClasses(classes.map(c => c.id === editItem.id ? { ...c, ...classForm } : c));
              else setClasses([...classes, classForm]);
              resetForms();
            };

            const handleSaveSubject = (e) => {
              e.preventDefault();
              if(editItem) setSubjects(subjects.map(s => s.id === editItem.id ? { ...s, ...subjectForm } : s));
              else setSubjects([...subjects, subjectForm]);
              resetForms();
            };

            const handleSaveStudent = (e) => {
              e.preventDefault();
              if(editItem) setStudents(students.map(s => s.id === editItem.id ? { ...s, ...studentForm, image: s.image } : s));
              else setStudents([...students, { ...studentForm, image: `https://api.dicebear.com/7.x/avataaars/svg?seed=${studentForm.id}&backgroundColor=b6e3f4` }]);
              resetForms();
            };

            const handleSaveAssign = (e) => {
              e.preventDefault();
              if(editItem) setAssignments(assignments.map(a => a.id === editItem.id ? { ...a, ...assignForm, maxScore: Number(assignForm.maxScore) } : a));
              else setAssignments([...assignments, { ...assignForm, maxScore: Number(assignForm.maxScore) }]);
              resetForms();
            };

            return (
              <div className="flex h-full bg-gray-50 overflow-hidden">
                {/* Settings Sidebar */}
                <div className="w-64 bg-white border-r border-gray-200 overflow-y-auto no-scrollbar hidden md:block">
                  <div className="p-4">
                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">เมนูการตั้งค่า</h3>
                    <ul className="space-y-1">
                      <li>
                        <button onClick={() => {setSettingsMenu('overview'); resetForms();}} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${settingsMenu === 'overview' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                          <i className="fas fa-chart-pie w-5 text-center"></i> ภาพรวมระบบ
                        </button>
                      </li>
                      <li>
                        <button onClick={() => {setSettingsMenu('classes'); resetForms();}} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${settingsMenu === 'classes' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                          <i className="fas fa-door-open w-5 text-center"></i> จัดการห้องเรียน
                        </button>
                      </li>
                      <li>
                        <button onClick={() => {setSettingsMenu('subjects'); resetForms();}} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${settingsMenu === 'subjects' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                          <i className="fas fa-book w-5 text-center"></i> จัดการรายวิชา
                        </button>
                      </li>
                      <li>
                        <button onClick={() => {setSettingsMenu('students'); resetForms();}} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${settingsMenu === 'students' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                          <i className="fas fa-user-graduate w-5 text-center"></i> จัดการนักเรียน
                        </button>
                      </li>
                      <li>
                        <button onClick={() => {setSettingsMenu('assignments'); resetForms();}} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${settingsMenu === 'assignments' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                          <i className="fas fa-tasks w-5 text-center"></i> จัดการชิ้นงาน
                        </button>
                      </li>
                    </ul>
                  </div>
                </div>

                {/* Settings Content Area */}
                <div className="flex-1 overflow-y-auto p-6 lg:p-8">
                  <div className="max-w-5xl mx-auto">
                    
                    {/* Overview Dashboard */}
                    {settingsMenu === 'overview' && (
                      <div className="animate-in fade-in">

                          <th className="border-b px-4 py-3 font-semibold min-w-[200px]">ชื่อ - นามสกุล</th>
                          <th className="border-b border-l px-4 py-3 text-center font-semibold bg-green-50/50 w-24">มาเรียน<br/><span className="text-xs text-gray-400 font-normal">วันนี้</span></th>
                          {filteredAssignments.map(a => <th key={a.id} className="border-b border-l px-4 py-3 text-center text-xs font-semibold">{a.title}<br/><span className="text-blue-500">({a.maxScore})</span></th>)}
                          {filteredAssignments.length > 0 && <th className="border-b border-l px-4 py-3 text-center bg-blue-50 font-semibold w-24">คะแนนรวม</th>}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {filteredStudents.sort((a,b) => a.number - b.number).map(s => {
                          const present = attendanceData[s.id]?.status === 'present';
                          let total = 0, max = 0;
                          return (
                            <tr key={s.id} className="hover:bg-gray-50 transition-colors">
                              <td className="px-4 py-3 text-center text-gray-600">{s.number}</td>
                              <td className="px-4 py-3 font-medium text-gray-800">{s.name}</td>
                              <td className="border-l px-4 py-3 text-center bg-green-50/10">{present ? <span className="text-green-500"><i className="fas fa-check"></i></span> : <span className="text-gray-300">-</span>}</td>
                              {filteredAssignments.map(a => {
                                const sc = assignmentData[a.id]?.[s.id]?.score;
                                total += (sc || 0); max += a.maxScore;
                                return <td key={a.id} className="border-l px-4 py-3 text-center text-gray-600">{sc !== undefined ? <span className="font-medium">{sc}</span> : <span className="text-gray-300">-</span>}</td>
                              })}
                              {filteredAssignments.length > 0 && <td className="border-l px-4 py-3 text-center font-bold text-blue-700 bg-blue-50/30">{total}/{max}</td>}
                            </tr>
                          )
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row font-sans">
              
              {/* Sidebar Menu */}
              <div className="print:hidden w-full md:w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20 relative">
                <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                  <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-xl shadow-lg shadow-blue-900/50"><i className="fas fa-barcode"></i></div>
                  <div>
                    <h1 className="text-lg font-bold text-white leading-tight">Smart Class</h1>
                    <p className="text-xs text-blue-300 mt-0.5">Teacher Pro</p>
                  </div>
                </div>
                
                <nav className="flex-1 p-4 space-y-1 overflow-y-auto no-scrollbar">
                  <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 mt-2 px-3">โหมดสแกนบาร์โค้ด</div>
                  <button onClick={() => setActiveTab('attendance')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'attendance' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                    <i className="fas fa-user-check w-5 text-center text-lg"></i> <span className="font-medium">เช็คชื่อเข้าเรียน</span>
                  </button>
                  <button onClick={() => setActiveTab('assignment')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'assignment' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                    <i className="fas fa-clipboard-check w-5 text-center text-lg"></i> <span className="font-medium">ตรวจงาน & ทวงงาน</span>
                  </button>

                  <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 mt-8 px-3">การจัดการระบบ</div>
                  <button onClick={() => setActiveTab('reports')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'reports' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                    <i className="fas fa-chart-bar w-5 text-center text-lg"></i> <span className="font-medium">รายงานสรุปผล</span>
                  </button>
                  <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'settings' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                    <i className="fas fa-cog w-5 text-center text-lg"></i> <span className="font-medium">ตั้งค่าระบบ</span>
                  </button>
                </nav>
                
                <div className="p-4 border-t border-slate-800">
                  <button onClick={handleLogout} className="w-full flex items-center gap-2 justify-center px-4 py-2.5 bg-slate-800 hover:bg-red-500 hover:text-white text-slate-400 rounded-lg transition-colors font-medium text-sm">
                    <i className="fas fa-sign-out-alt"></i> ออกจากระบบ
                  </button>
                </div>
              </div>

              {/* Main Workspace */}
              <div className="flex-1 flex flex-col h-screen overflow-hidden relative print:h-auto print:overflow-visible">
                
                {/* Context Selector Header (Hidden in Settings) */}
                {activeTab !== 'settings' && (
                  <div className="print:hidden bg-white border-b px-6 py-3 flex flex-wrap gap-4 items-center justify-between z-10 shadow-sm">
                    <div className="flex items-center gap-4 text-sm">
                      <div className="flex items-center gap-2">
                        <span className="text-gray-500 font-medium"><i className="fas fa-door-open text-gray-400"></i> ห้องเรียน:</span>
                        <select value={currentClassId} onChange={e=>setCurrentClassId(e.target.value)} className="bg-gray-100 border-none text-blue-700 font-bold rounded-md py-1.5 px-3 outline-none cursor-pointer hover:bg-gray-200 transition-colors">
                          {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                          {classes.length === 0 && <option value="">- ไม่มีข้อมูล -</option>}
                        </select>
                      </div>
                      {(activeTab === 'assignment' || activeTab === 'reports') && (
                        <div className="flex items-center gap-2 border-l pl-4">
                          <span className="text-gray-500 font-medium"><i className="fas fa-book text-gray-400"></i> วิชา:</span>
                          <select value={currentSubjectId} onChange={e=>setCurrentSubjectId(e.target.value)} className="bg-gray-100 border-none text-purple-700 font-bold rounded-md py-1.5 px-3 outline-none cursor-pointer hover:bg-gray-200 transition-colors">
                            {subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                            {subjects.length === 0 && <option value="">- ไม่มีข้อมูล -</option>}
                          </select>
                        </div>
                      )}
                    </div>
                    <div className="text-xs text-gray-400">
                      แสดงผลตามห้องเรียน/วิชา ที่เลือกเท่านั้น
                    </div>
                  </div>
                )}

                {/* Main Content Area */}
                {activeTab === 'settings' && <SettingsTab />}
                {activeTab === 'reports' && <ReportsTab />}

                {/* Scanner Interface */}
                {(activeTab === 'attendance' || activeTab === 'assignment') && (
                  <div className="flex flex-col h-full bg-gray-50">
                    <div className="print:hidden bg-white p-6 shadow-sm z-10 border-b">
                      <div className="max-w-3xl mx-auto">
                        <div className="mb-4">
                          <h2 className="text-2xl font-bold text-gray-800">
                            {activeTab === 'attendance' ? 'ระบบเช็คชื่อเข้าเรียน' : 'ระบบตรวจรับงานและประวัตินักเรียน'}
                          </h2>
                          <p className="text-gray-500 text-sm mt-1">
                            {activeTab === 'attendance' ? `กำลังเช็คชื่อนักเรียนห้อง ${classes.find(c=>c.id===currentClassId)?.name || '...'}` : `กำลังตรวจงานวิชา ${subjects.find(s=>s.id===currentSubjectId)?.name || '...'} ของนักเรียนห้อง ${classes.find(c=>c.id===currentClassId)?.name || '...'}`}
                          </p>
                        </div>

                        <form onSubmit={handleScanSubmit} className="relative shadow-sm rounded-xl">
                          <div className="absolute inset-y-0 left-0 flex items-center pl-5 pointer-events-none">
                            <i className="fas fa-barcode text-2xl text-blue-500"></i>
                          </div>
                          <input
                            ref={scannerInputRef} type="text"
                            className="bg-white border-2 border-blue-100 text-gray-900 text-xl rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 block w-full pl-14 p-4 outline-none transition-all shadow-inner"
                            placeholder="สแกนบาร์โค้ด หรือพิมพ์รหัสนักเรียน แล้วกด Enter..."
                            value={barcodeInput} onChange={(e) => setBarcodeInput(e.target.value)}
                            autoComplete="off" disabled={comprehensiveModal.isOpen || classes.length===0}
                          />
                        </form>
                      </div>
                    </div>

                    {lastScanned && !comprehensiveModal.isOpen && (
                      <div className="max-w-3xl mx-auto w-full mt-6 px-6">
                        <div className={`p-4 rounded-xl flex items-center gap-4 shadow-sm border ${lastScanned.type === 'success' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                          {lastScanned.type === 'success' ? <i className="fas fa-check-circle text-4xl text-green-500"></i> : <i className="fas fa-times-circle text-4xl text-red-500"></i>}
                          <div>
                            <p className="font-bold text-lg text-gray-800">{lastScanned.message}</p>
                            {lastScanned.student && <p className="text-sm text-gray-600">{lastScanned.student.name} (รหัส: {lastScanned.student.id})</p>}
                          </div>
                        </div>
                      </div>
                    )}

                    <div className="print:hidden flex-1 flex items-center justify-center p-6">
                       <div className="text-center text-gray-400">
                          <div className="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm"><i className="fas fa-qrcode text-4xl text-gray-300"></i></div>
                          <h3 className="text-lg font-medium text-gray-500">พร้อมรับข้อมูลบาร์โค้ด</h3>
                          <p className="text-sm mt-1">เครื่องสแกนอยู่ในโหมดสแตนด์บาย</p>
                       </div>
                    </div>
                  </div>
                )}

                {/* Grading Modal */}
                {comprehensiveModal.isOpen && comprehensiveModal.student && (
                  <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden animate-in zoom-in-95 flex flex-col max-h-[90vh]">
                      
                      <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white flex items-center justify-between shadow-inner">
                        <div className="flex items-center gap-5">
                          <img src={comprehensiveModal.student.image} alt="Student" className="w-20 h-20 rounded-full border-4 border-white/20 bg-white shadow-lg" />
                          <div>
                            <h3 className="text-2xl font-bold">{comprehensiveModal.student.name}</h3>
                            <p className="text-blue-100 text-sm mt-1">ห้อง {classes.find(c=>c.id === comprehensiveModal.student.classId)?.name} | เลขที่ {comprehensiveModal.student.number} | รหัส: {comprehensiveModal.student.id}</p>
                          </div>
                        </div>
                        <div className="text-right">
                           <div className="text-xs text-blue-200 mb-1 uppercase tracking-wider font-bold">วิชาที่กำลังตรวจ</div>
                           <div className="bg-white/20 px-4 py-2 rounded-lg font-medium backdrop-blur-md border border-white/10 shadow-sm">{subjects.find(s=>s.id === currentSubjectId)?.name}</div>
                        </div>
                      </div>
                      
                      <div className="p-6 overflow-y-auto bg-slate-50 flex-1">
                        <div className="flex items-center justify-between mb-4">
                          <h4 className="font-bold text-gray-700 flex items-center gap-2">
                            <i className="fas fa-tasks text-indigo-500"></i> รายการชิ้นงานทั้งหมดในวิชานี้
                          </h4>
                          <span className="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-md font-medium">{filteredAssignments.length} ชิ้นงาน</span>
                        </div>
                        
                        <div className="space-y-3">
                          {filteredAssignments.length === 0 ? (
                            <div className="text-center p-8 text-gray-400 border-2 border-dashed rounded-xl bg-white">ยังไม่มีการสร้างชิ้นงานในวิชานี้</div>
                          ) : filteredAssignments.map((assignment, idx) => {
                            const isMissing = modalScores[assignment.id] === '' || modalScores[assignment.id] === undefined;
                            
                            return (
                              <div key={assignment.id} className={`p-4 rounded-xl border-2 flex items-center justify-between transition-colors ${isMissing ? 'bg-red-50/50 border-red-100 hover:border-red-300' : 'bg-white border-transparent shadow-sm hover:border-green-200'}`}>
                                <div className="flex-1">
                                  <div className="flex items-center gap-2">
                                    <span className="font-semibold text-gray-800">{assignment.title}</span>
                                    {isMissing && <span className="px-2 py-0.5 text-[10px] bg-red-100 text-red-600 rounded-full font-bold flex items-center gap-1 uppercase tracking-wider"><i className="fas fa-exclamation-circle"></i> ค้างส่ง</span>}
                                  </div>
                                  <p className="text-xs text-gray-500 mt-1 font-mono">รหัส: {assignment.id}</p>
                                </div>
                                
                                <div className="flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-100">
                                  <label className="text-xs font-bold text-gray-500 uppercase tracking-wide">คะแนน:</label>
                                  <div className="relative">
                                    <input
                                      autoFocus={idx === 0} 
                                      type="number"
                                      min="0" max={assignment.maxScore} step="0.5"
                                      className={`w-24 text-center text-lg py-1.5 border-2 rounded-lg focus:ring-4 focus:outline-none font-mono font-bold transition-all ${isMissing ? 'border-red-200 focus:border-red-500 focus:ring-red-100 bg-white text-red-600' : 'border-green-300 focus:border-green-500 focus:ring-green-100 bg-green-50 text-green-700'}`}
                                      value={modalScores[assignment.id]}
                                      onChange={(e) => setModalScores({...modalScores, [assignment.id]: e.target.value})}
                                      placeholder="-"
                                    />
                                    <span className="absolute right-[-40px] top-1/2 -translate-y-1/2 text-sm text-gray-400 font-bold">/ {assignment.maxScore}</span>
                                  </div>
                                  <div className="w-10"></div> {/* Spacer for max score */}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="p-5 bg-white border-t border-gray-100 flex justify-between items-center bg-gray-50/50">
                        <div className="text-sm text-gray-500"><i className="fas fa-keyboard"></i> กด Tab เพื่อเลื่อนช่อง ถัดไปกด Enter เพื่อบันทึก</div>
                        <div className="flex gap-3">
                          <button type="button" onClick={() => setComprehensiveModal({ isOpen: false, student: null })} className="px-6 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl font-medium hover:bg-gray-50 shadow-sm transition-colors">ยกเลิก</button>
                          <button type="button" onClick={handleSaveAllScores} className="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-md shadow-blue-200 flex items-center gap-2 transition-all hover:scale-105 active:scale-95"><i className="fas fa-save text-lg"></i> บันทึกคะแนนทั้งหมด</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
